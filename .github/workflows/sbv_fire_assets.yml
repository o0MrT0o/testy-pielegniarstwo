name: SBV Fire Assets

on:
  push:
    paths:
      - '.github/workflows/sbv_fire_assets.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'kokoro-onnx==0.6.1' soundfile

      - name: Download NASA source footage
        run: |
          mkdir -p out
          curl -L --fail --retry 3 -o out/flexflame.mp4 'https://svs.gsfc.nasa.gov/vis/a010000/a011300/a011318/ISS_FlexFlame-540-MASTER_high.mp4'
          curl -L --fail --retry 3 -o out/flex_full.mp4 'https://svs.gsfc.nasa.gov/vis/a010000/a011300/a011318/ISS_Flex-540-MASTER_high.mp4'
          curl -L --fail --retry 3 -o out/jellyfish_flame.mp4 'https://svs.gsfc.nasa.gov/vis/a010000/a011600/a011640/162_JellyfishFlame-540-MASTER_high.mp4'

      - name: Download exact Kokoro voice assets
        run: |
          curl -L --fail --retry 3 -o kokoro-v1.0.onnx 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx'
          curl -L --fail --retry 3 -o voices-v1.0.bin 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin'
          sha256sum kokoro-v1.0.onnx voices-v1.0.bin | tee out/kokoro_hashes.txt

      - name: Generate channel voice
        run: |
          cat > make_voice.py <<'PY'
          import soundfile as sf
          from kokoro_onnx import Kokoro
          text = "This is a real flame. So why does it look like a glowing ball? On Earth, hot gas rises, pulling cooler air in from below. That flow stretches fire into the familiar teardrop shape. In microgravity, hot gas doesn't rise the same way. Oxygen reaches the flame from all directions, so it wraps around the fuel as a sphere. NASA's FLEX experiments filmed this aboard the International Space Station. And it isn't just a curiosity: understanding fire without gravity helps engineers make spacecraft safer. Same fire. Different gravity. Completely different shape."
          kokoro = Kokoro('kokoro-v1.0.onnx','voices-v1.0.bin')
          audio, sr = kokoro.create(text, voice='af_heart', speed=0.88, lang='en-us', continuous=True)
          sf.write('out/narration.wav', audio, sr, subtype='PCM_16')
          open('out/script.txt','w').write(text+'\n')
          PY
          python make_voice.py
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 out/narration.wav | tee out/narration_duration.txt
          sha256sum out/narration.wav | tee out/narration_sha256.txt

      - name: Generate source contact sheets
        run: |
          for f in flexflame flex_full jellyfish_flame; do
            ffmpeg -y -i out/${f}.mp4 -vf "fps=1/3,scale=480:-2,tile=5x5:padding=4:margin=4" -frames:v 1 out/${f}_sheet.jpg
            ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of json out/${f}.mp4 > out/${f}_probe.json
          done

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: sbv-fire-assets
          path: out/
          retention-days: 1
