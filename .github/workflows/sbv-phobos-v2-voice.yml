name: SBV Phobos V2 original approved narrator
on:
  push:
    branches: [sbv-space03-phobos-v2-2026-10-21]
    paths: ['.github/workflows/sbv-phobos-v2-voice.yml']
permissions: {contents: read}
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Install exact channel voice engine
        run: |
          sudo apt-get update -qq && sudo apt-get install -y espeak-ng libsndfile1
          pip install kokoro-onnx==0.6.1 soundfile faster-whisper
      - name: Download and verify locked synthetic voice model
        run: |
          curl -LfSs --retry 4 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx' -o kokoro-v1.0.onnx
          curl -LfSs --retry 4 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' -o voices-v1.0.bin
      - name: Render corrected narrator af_heart 0.88 and word timing
        run: |
          cat >/tmp/phobos_voice.py <<'PY'
          import os,hashlib,json,soundfile as sf
          from kokoro_onnx import Kokoro
          script="Look at this eclipse. That is not Earth's Moon. NASA filmed it on Mars. That jagged silhouette is Phobos, a potato-shaped moon. These eclipses can last just thirty to forty seconds. But Phobos is spiraling closer to Mars, about one point eight metres every hundred years. In roughly thirty to fifty million years, it could break apart or crash into the planet. This moon will not last forever."
          expected={"kokoro-v1.0.onnx":"beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a","voices-v1.0.bin":"bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d"}
          for fn,sha in expected.items():
           got=hashlib.file_digest(open(fn,"rb"),"sha256").hexdigest();assert got==sha,(fn,got)
          voice=Kokoro("kokoro-v1.0.onnx","voices-v1.0.bin")
          wave,sr=voice.create(script,voice="af_heart",speed=0.88,lang="en-us")
          os.makedirs("out",exist_ok=True)
          sf.write("out/SBV_SPACE03_PHOBOS_V2_af_heart.wav",wave,sr,subtype="PCM_24")
          open("out/narration.txt","w").write(script)
          print("VOICE_SEC",len(wave)/sr,flush=True)
          assert 18<len(wave)/sr<35
          try:
           import av
           old=av.open
           def patched(*a,**kw):
            kw.pop("metadata_errors",None);return old(*a,**kw)
           av.open=patched
           from faster_whisper import WhisperModel
           model=WhisperModel("tiny.en",device="cpu",compute_type="int8",cpu_threads=2)
           segments,_=model.transcribe("out/SBV_SPACE03_PHOBOS_V2_af_heart.wav",language="en",word_timestamps=True,beam_size=3,vad_filter=False)
           words=[{"word":w.word,"start":round(w.start,3),"end":round(w.end,3)} for seg in segments for w in (seg.words or [])]
           json.dump(words,open("out/word_timings.json","w"),indent=2)
           print("ASR", " ".join(q["word"] for q in words),flush=True)
          except Exception as e: print("ASR_WARNING",repr(e),flush=True)
          
          PY
          python /tmp/phobos_voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: SBV_SPACE03_V2_Corrected_af_heart
          path: out/
          retention-days: 7
