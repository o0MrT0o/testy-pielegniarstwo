name: SBV Racetrack Temp Build

on:
  push:
    branches: [sbv-racetrack-temp]
    paths:
      - '.github/workflows/sbv-racetrack-temp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install yt-dlp kokoro-onnx soundfile numpy
      - name: Download Kokoro v1.0 and render af_heart
        run: |
          mkdir -p build
          curl -L --fail --retry 3 -o build/kokoro-v1.0.onnx 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx'
          curl -L --fail --retry 3 -o build/voices-v1.0.bin 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin'
          cat > build/voice.py <<'PY'
          import numpy as np
          import soundfile as sf
          from kokoro_onnx import Kokoro
          k=Kokoro('build/kokoro-v1.0.onnx','build/voices-v1.0.bin')
          parts=[
          ('This rock can weigh hundreds of pounds.',.18),
          ('Yet it leaves a trail across a flat desert, with nobody touching it.',.18),
          ('For decades, no one saw the rocks move.',.18),
          ('Then scientists finally caught them in action.',.18),
          ("The culprit wasn't hurricane wind.",.18),
          ('It was ice.',.18),
          ('A shallow pond froze into a sheet just millimeters thick.',.18),
          ('Morning sun cracked it into floating panels.',.18),
          ('Light wind pushed the ice against the rocks,',.09),
          ('sliding them across wet mud.',.18),
          ('In one event, more than sixty moved.',.18),
          ('Strange, but verified.',0)]
          audio=[]; timing=[]; t=0; sr=24000
          for i,(text,pause) in enumerate(parts):
              y,sr=k.create(text,voice='af_heart',speed=.88,lang='en-us')
              y=np.asarray(y,dtype=np.float32); d=len(y)/sr
              timing.append((i,t,t+d,text)); audio.append(y); t+=d
              if pause:
                  audio.append(np.zeros(int(sr*pause),dtype=np.float32)); t+=pause
          y=np.concatenate(audio); y*=.92/max(1e-6,float(np.max(np.abs(y))))
          sf.write('build/racetrack_af_heart.wav',y,sr,subtype='PCM_16')
          with open('build/voice_timing.tsv','w') as f:
              for i,a,b,text in timing:f.write(f'{i}\t{a:.3f}\t{b:.3f}\t{text}\n')
          print('duration',len(y)/sr)
          PY
          python build/voice.py
          ffmpeg -hide_banner -loglevel error -y -i build/racetrack_af_heart.wav -filter:a loudnorm=I=-15.2:TP=-1.5:LRA=5 build/racetrack_af_heart_master.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 build/racetrack_af_heart_master.wav > build/voice_duration.txt
      - name: Download NPS Racetrack B-roll
        run: |
          mkdir -p build/assets
          yt-dlp --no-playlist --merge-output-format mp4 -f 'best[ext=mp4]/best' -o 'build/assets/nps_racetrack.%(ext)s' 'https://www.nps.gov/media/video/view.htm?id=582F570D-B9C7-8138-0C0BDC270BD0D080'
          SRC=$(find build/assets -maxdepth 1 -type f -name 'nps_racetrack.*' | head -1)
          if [ "$SRC" != 'build/assets/nps_racetrack.mp4' ]; then ffmpeg -hide_banner -loglevel error -y -i "$SRC" -c:v libx264 -pix_fmt yuv420p -an build/assets/nps_racetrack.mp4; fi
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 build/assets/nps_racetrack.mp4 > build/nps_duration.txt
          ffmpeg -hide_banner -loglevel error -y -i build/assets/nps_racetrack.mp4 -vf "fps=1/8,scale=360:-2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='%{pts\\:hms}':x=10:y=10:fontsize=22:fontcolor=white:borderw=3:bordercolor=black,tile=5x5:padding=5:margin=5" -frames:v 1 build/nps_contact.jpg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbv-racetrack-temp-inspection
          path: |
            build/racetrack_af_heart.wav
            build/racetrack_af_heart_master.wav
            build/voice_timing.tsv
            build/voice_duration.txt
            build/nps_duration.txt
            build/nps_contact.jpg
          retention-days: 2
