name: SBV SPACE03 exact af_heart
on:
  push:
    branches: [sbv-space03-phobos-2026-10-21]
    paths: ['.github/workflows/sbv-phobos-voice.yml']
permissions: {contents: read}
jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y espeak-ng libsndfile1
          pip install kokoro-onnx==0.6.1 soundfile faster-whisper
      - name: Fetch and verify locked SBV voice weights
        run: |
          curl -LfSs --retry 4 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx' -o kokoro-v1.0.onnx
          curl -LfSs --retry 4 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' -o voices-v1.0.bin
      - name: Original channel female voice af_heart speed point eight eight
        run: |
          cat >/tmp/voice.py <<'PY'
          import os,hashlib,json,soundfile as sf
          from kokoro_onnx import Kokoro
          script="Look at this eclipse. That is not Earth's Moon. NASA filmed it on Mars. The jagged shadow is Phobos, a tiny, potato-shaped moon. It crosses the Sun in only about thirty seconds. But here is the strangest part. Phobos is slowly spiraling closer to Mars. In tens of millions of years, it could break apart, or crash into the planet. Mars may eventually lose the moon that made this eclipse."
          expected={"kokoro-v1.0.onnx":"beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a","voices-v1.0.bin":"bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d"}
          for fn,sha in expected.items():
           actual=hashlib.file_digest(open(fn,"rb"),"sha256").hexdigest()
           assert actual==sha,(fn,actual)
           print("VERIFIED_MODEL",fn,flush=True)
          v=Kokoro("kokoro-v1.0.onnx","voices-v1.0.bin")
          wav,sr=v.create(script,voice="af_heart",speed=0.88,lang="en-us")
          os.makedirs("out",exist_ok=True)
          sf.write("out/SBV_SPACE03_PHOBOS_af_heart.wav",wav,sr,subtype="PCM_24")
          open("out/narration.txt","w").write(script)
          print("VOICE_DURATION",len(wav)/sr,flush=True)
          try:
           import av
           original=av.open
           def patched(*args,**kwargs):
            kwargs.pop("metadata_errors",None)
            return original(*args,**kwargs)
           av.open=patched
           from faster_whisper import WhisperModel
           m=WhisperModel("tiny.en",device="cpu",compute_type="int8",cpu_threads=2)
           segments,_=m.transcribe("out/SBV_SPACE03_PHOBOS_af_heart.wav",language="en",word_timestamps=True,beam_size=3,vad_filter=False)
           words=[{"word":w.word,"start":round(w.start,3),"end":round(w.end,3)} for seg in segments for w in (seg.words or [])]
           json.dump(words,open("out/word_timings.json","w"),indent=2)
           print("ASR"," ".join(x["word"] for x in words),flush=True)
          except Exception as e:print("ASR_WARNING",type(e).__name__,str(e),flush=True)
          
          PY
          python /tmp/voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: SBV_SPACE03_Original_af_heart_Narration
          path: out/
          compression-level: 0
          retention-days: 7
