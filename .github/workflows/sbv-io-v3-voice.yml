name: IO V3 original SBV af_heart voice
on:
  push:
    branches: [sbv-space04-io-v3-20261021]
    paths: ['.github/workflows/sbv-io-v3-voice.yml']
permissions: {contents: read}
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - name: Prepare pinned SBV voice
        run: |
          sudo apt-get update -qq && sudo apt-get install -y espeak-ng libsndfile1
          pip install 'kokoro-onnx==0.6.1' soundfile faster-whisper
      - name: Download verified original model
        run: |
          curl -LfSs --retry 4 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx' -o kokoro-v1.0.onnx
          curl -LfSs --retry 4 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' -o voices-v1.0.bin
      - name: Synthesize approved voice and align timestamps
        run: |
          cat > /tmp/voice.py <<'PY'
          import os,hashlib,json,soundfile as sf
          from kokoro_onnx import Kokoro
          text="That bright spot is volcanic heat, on Jupiter's moon Io. Juno recorded it in infrared. But look at this plume. Another NASA spacecraft caught it rising three hundred and thirty kilometres above Io. Why do volcanoes cover this moon? Jupiter and nearby moons stretch Io, heating it from within. The most volcanically active world in our solar system isn't even a planet."
          expected={"kokoro-v1.0.onnx":"beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a","voices-v1.0.bin":"bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d"}
          for path,expected_sha in expected.items():
           observed=hashlib.file_digest(open(path,"rb"),"sha256").hexdigest()
           assert observed==expected_sha, (path,observed)
          k=Kokoro("kokoro-v1.0.onnx","voices-v1.0.bin")
          audio,sr=k.create(text,voice="af_heart",speed=0.88,lang="en-us")
          os.makedirs("out",exist_ok=True)
          sf.write("out/IO_V3_af_heart.wav",audio,sr,subtype="PCM_24")
          open("out/narration.txt","w").write(text)
          print("DURATION_SECONDS",len(audio)/sr,flush=True)
          try:
           import av
           original=av.open
           def patched(*args,**kwargs):
            kwargs.pop("metadata_errors",None)
            return original(*args,**kwargs)
           av.open=patched
           from faster_whisper import WhisperModel
           whisper=WhisperModel("tiny.en",device="cpu",compute_type="int8",cpu_threads=2)
           segments,_=whisper.transcribe("out/IO_V3_af_heart.wav",language="en",beam_size=3,word_timestamps=True,vad_filter=False)
           words=[{"word":w.word,"start":round(w.start,3),"end":round(w.end,3)} for seg in segments for w in (seg.words or [])]
           json.dump(words,open("out/timing.json","w"),indent=2)
           print("ASR"," ".join(w["word"] for w in words),flush=True)
          except Exception as e:print("ASR_ERROR",repr(e),flush=True)
          
          PY
          python /tmp/voice.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SBV_IO_V3_af_heart_Script_WAV_Timings
          path: out/
          retention-days: 7
