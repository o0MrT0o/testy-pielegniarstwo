name: SBV Male Documentary Voice Tests

on:
  push:
    paths:
      - '.github/workflows/sbv-male-doc-voices.yml'

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg

      - name: Kokoro env
        run: |
          python -m venv .venv-kokoro
          .venv-kokoro/bin/python -m pip install --upgrade pip
          .venv-kokoro/bin/python -m pip install 'kokoro-onnx==0.6.1' soundfile
          curl -L --fail -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -L --fail -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin

      - name: Generate serious male reference voices
        run: |
          cat > make_refs.py <<'PY'
          import soundfile as sf
          from kokoro_onnx import Kokoro
          text = "Across the frozen river, a vast circle of ice turns almost silently. No machine carved it. No one set it in motion. The river itself did that."
          k = Kokoro('kokoro-v1.0.onnx','voices-v1.0.bin')
          for voice,speed,lang,out in [
              ('am_fenrir',0.84,'en-us','REF_US_FENRIR.wav'),
              ('bm_george',0.86,'en-gb','REF_UK_GEORGE.wav')]:
              audio,sr = k.create(text, voice=voice, speed=speed, lang=lang)
              sf.write(out, audio, sr, subtype='PCM_16')
          PY
          .venv-kokoro/bin/python make_refs.py

      - name: Chatterbox env
        run: |
          python -m venv .venv-chatter
          .venv-chatter/bin/python -m pip install --upgrade pip setuptools wheel
          .venv-chatter/bin/python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          .venv-chatter/bin/python -m pip install chatterbox-tts==0.1.6 soundfile
          .venv-chatter/bin/python -m pip uninstall -y resemble-perth
          .venv-chatter/bin/python -m pip install --no-deps 'git+https://github.com/resemble-ai/Perth.git@master'

      - name: Generate sentence-level male documentary variants
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
        run: |
          cat > synth.py <<'PY'
          import random, numpy as np, torch, torchaudio as ta
          import chatterbox.tts_turbo as turbo
          from huggingface_hub import snapshot_download as hf_snapshot_download

          SENTENCES = [
              "As the mass turns, it rubs against surrounding ice and shoreline, grinding the edge smoother and smoother.",
              "And the spinning may get help from the ice itself.",
              "Lab experiments found that melting can create a vortex underneath an ice disk and keep it rotating."
          ]

          def public_snapshot_download(*args, **kwargs):
              kwargs.pop('token', None)
              return hf_snapshot_download(*args, token=False, **kwargs)
          turbo.snapshot_download = public_snapshot_download

          model = turbo.ChatterboxTurboTTS.from_pretrained(device='cpu')
          settings=dict(
              temperature=0.52,
              min_p=0.0,
              top_p=0.84,
              top_k=700,
              repetition_penalty=1.15,
              norm_loudness=True,
          )
          voices = [
              ('REF_US_FENRIR.wav','F_US_MALE_DOC',101),
              ('REF_UK_GEORGE.wav','G_UK_MALE_DOC',201),
          ]
          for ref,prefix,seed0 in voices:
              for i,text in enumerate(SENTENCES,1):
                  seed = seed0 + i
                  random.seed(seed); np.random.seed(seed); torch.manual_seed(seed)
                  wav = model.generate(text, audio_prompt_path=ref, **settings)
                  ta.save(f'{prefix}_S{i}_RAW.wav', wav.cpu(), model.sr)
                  print(prefix, i, model.sr, wav.shape[-1])
          PY
          .venv-chatter/bin/python synth.py

      - name: Clean pauses assemble and master
        run: |
          set -e
          for prefix in F_US_MALE_DOC G_UK_MALE_DOC; do
            for i in 1 2 3; do
              ffmpeg -y -v error -i ${prefix}_S${i}_RAW.wav \
                -af "silenceremove=start_periods=1:start_duration=0.03:start_threshold=-45dB:stop_periods=-1:stop_duration=0.65:stop_threshold=-45dB:stop_silence=0.25" \
                ${prefix}_S${i}_CLEAN.wav
            done

            ffmpeg -y -v error \
              -i ${prefix}_S1_CLEAN.wav -i ${prefix}_S2_CLEAN.wav -i ${prefix}_S3_CLEAN.wav \
              -f lavfi -t 0.30 -i anullsrc=r=24000:cl=mono \
              -f lavfi -t 0.34 -i anullsrc=r=24000:cl=mono \
              -filter_complex "[0:a][3:a][1:a][4:a][2:a]concat=n=5:v=0:a=1[voice]" \
              -map "[voice]" ${prefix}_ASSEMBLED.wav

            ffmpeg -y -v error -i ${prefix}_ASSEMBLED.wav \
              -af loudnorm=I=-16:TP=-2:LRA=5 -ar 48000 -ac 1 ${prefix}_FINAL.wav
            ffmpeg -y -v error -i ${prefix}_FINAL.wav \
              -codec:a libmp3lame -b:a 192k ${prefix}_FINAL.mp3
            ffmpeg -v error -i ${prefix}_FINAL.wav -f null -
            ffmpeg -hide_banner -i ${prefix}_FINAL.wav \
              -af ebur128=peak=true -f null - 2> ${prefix}_ebur128.txt
            ffmpeg -hide_banner -i ${prefix}_FINAL.mp3 \
              -af silencedetect=noise=-42dB:d=0.7 -f null - 2> ${prefix}_silence.txt
          done

          ffprobe -v error -show_entries format=duration,size \
            -show_entries stream=codec_name,sample_rate,channels -of json \
            F_US_MALE_DOC_FINAL.mp3 > F_probe.json
          ffprobe -v error -show_entries format=duration,size \
            -show_entries stream=codec_name,sample_rate,channels -of json \
            G_UK_MALE_DOC_FINAL.mp3 > G_probe.json
          sha256sum F_US_MALE_DOC_FINAL.* G_UK_MALE_DOC_FINAL.* > SHA256.txt

      - name: Upload clean male documentary variants
        uses: actions/upload-artifact@v4
        with:
          name: SBV-Male-Documentary-Voices-Clean
          path: |
            F_US_MALE_DOC_FINAL.mp3
            F_US_MALE_DOC_FINAL.wav
            G_UK_MALE_DOC_FINAL.mp3
            G_UK_MALE_DOC_FINAL.wav
            F_US_MALE_DOC_ebur128.txt
            G_UK_MALE_DOC_ebur128.txt
            F_US_MALE_DOC_silence.txt
            G_UK_MALE_DOC_silence.txt
            F_probe.json
            G_probe.json
            REF_US_FENRIR.wav
            REF_UK_GEORGE.wav
            SHA256.txt
          retention-days: 7
