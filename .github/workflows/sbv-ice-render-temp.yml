name: SBV Ice Circle Temp Render

on:
  push:
    branches: [ sbv-ice-render-temp ]
    paths:
      - 'sbv_ice_render/**'
      - '.github/workflows/sbv-ice-render-temp.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: pip install -r sbv_ice_render/requirements.txt
      - name: Patch calm V3 edit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sbv_ice_render/render_ice_circle.py')
          s=p.read_text()
          old_filter='vf=f"scale=-2:{H},crop={W}:{H}:(iw-{W})/2:0,fps={FPS},setsar=1"'
          new_filter='vf=f"split=2[bg][fg];[bg]scale={W}:{H}:force_original_aspect_ratio=increase,crop={W}:{H},gblur=sigma=28[bg2];[fg]scale=1440:810,crop={W}:810:(iw-{W})/2:0[fg2];[bg2][fg2]overlay=0:410,fps={FPS},setsar=1"'
          if old_filter not in s:
              raise SystemExit('Expected Vana filter not found')
          s=s.replace(old_filter,new_filter)
          old_specs='''    vana_len=max(0.1,t_grand-t_vana)\n    d=[vana_len*0.24,vana_len*0.26,vana_len*0.25,vana_len*0.25]\n    specs=[\n      (grand, 1.2, t_vana, 'grand'),\n      (vana, 4.0, d[0], 'vana'),\n      (vana, 31.0, d[1], 'vana'),\n      (vana, 59.0, d[2], 'vana'),\n      (vana, 89.0, d[3], 'vana'),\n      (grand, 21.0, total-t_grand, 'grand'),\n    ]'''
          new_specs='''    split_mid=timing[5][0]\n    specs=[\n      (grand, 1.2, t_vana, 'grand'),\n      (vana, 59.0, split_mid-t_vana, 'vana'),\n      (vana, 89.0, t_grand-split_mid, 'vana'),\n      (grand, 21.0, total-t_grand, 'grand'),\n    ]'''
          if old_specs not in s:
              raise SystemExit('Expected Vana edit block not found')
          p.write_text(s.replace(old_specs,new_specs))
          PY
      - name: Render and QA
        run: python sbv_ice_render/render_ice_circle.py
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: sbv-ice-circle-final-v3
          path: sbv_ice_render/output/
          if-no-files-found: error
          retention-days: 3
