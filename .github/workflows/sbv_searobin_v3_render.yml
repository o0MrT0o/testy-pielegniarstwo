name: SBV Searobin V3 Final Render

on:
  push:
    paths:
      - '.github/workflows/sbv_searobin_v3_render.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install 'kokoro-onnx==0.6.1' 'onnxruntime>=1.17,<2' 'soundfile>=0.13' 'numpy>=1.26,<3'

      - name: Download source and voice models
        run: |
          set -euxo pipefail
          mkdir -p work/assets work/models work/out work/qa
          curl -L --fail --retry 4 --retry-all-errors -o work/assets/searobin.mp4 'https://oceanexplorer.noaa.gov/wp-content/uploads/2018/05/searobin_1280x720.mp4'
          curl -L --fail --retry 4 --retry-all-errors -o work/models/kokoro-v1.0.onnx 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx'
          curl -L --fail --retry 4 --retry-all-errors -o work/models/voices-v1.0.bin 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin'
          echo 'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  work/models/kokoro-v1.0.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  work/models/voices-v1.0.bin' | sha256sum -c -

      - name: Render and audit V3
        run: |
          cat > work/render_v3.py <<'PY'
          import dataclasses, hashlib, json, os, re, subprocess
          from pathlib import Path
          import numpy as np
          import onnxruntime as ort
          import soundfile as sf
          from kokoro_onnx import Kokoro

          W=Path('work'); A=W/'assets'; M=W/'models'; O=W/'out'; Q=W/'qa'
          SRC=A/'searobin.mp4'; MODEL=M/'kokoro-v1.0.onnx'; VOICES=M/'voices-v1.0.bin'
          FINAL=O/'SBV_Armored_Searobin_FINAL_YouTube_V3.mp4'

          SCRIPT=("That fish is walking. So what are those legs? They're actually thickened fin rays. "
                  "This is an armored searobin. Walking is its normal way to move across the seafloor instead of swimming. "
                  "But look under its mouth. Those whiskers have taste buds that help it sense food on the bottom. "
                  "It walks — and tastes — the seafloor.")

          CUES=[
            ("That fish is walking.",r"THAT FISH IS {\c&H66D7FF&}WALKING{\c&HFFFFFF&}."),
            ("So what are those legs?",r"SO WHAT ARE THOSE {\c&H66D7FF&}LEGS{\c&HFFFFFF&}?"),
            ("They're actually thickened fin rays.",r"THEY'RE ACTUALLY\N{\c&H66D7FF&}THICKENED FIN RAYS{\c&HFFFFFF&}."),
            ("This is an armored searobin.",r"THIS IS AN\N{\c&H66D7FF&}ARMORED SEAROBIN{\c&HFFFFFF&}."),
            ("Walking is its normal way to move across the seafloor instead of swimming.",r"WALKING IS ITS NORMAL\NWAY TO MOVE HERE."),
            ("But look under its mouth.",r"BUT LOOK\N{\c&H66D7FF&}UNDER ITS MOUTH{\c&HFFFFFF&}."),
            ("Those whiskers have taste buds",r"THOSE WHISKERS HAVE\N{\c&H66D7FF&}TASTE BUDS{\c&HFFFFFF&}."),
            ("that help it sense food on the bottom.",r"THEY HELP IT {\c&H66D7FF&}SENSE FOOD{\c&HFFFFFF&}\NON THE BOTTOM."),
            ("It walks — and tastes — the seafloor.",r"IT {\c&H66D7FF&}WALKS{\c&HFFFFFF&} — AND {\c&H66D7FF&}TASTES{\c&HFFFFFF&} —\NTHE SEAFLOOR.")]

          HEAD=.08
          STARTS=[18.0,20.5,24.0,27.0,30.0,40.5,21.0,33.0,18.8]
          WIDTHS=[2200,2200,3000,3000,3000,2200,2300,3200,2200]
          XRAT=[0.42,0.50,0.50,0.50,0.50,0.50,0.50,0.50,0.44]

          def run(cmd, cap=False, check=True):
              print('+',' '.join(map(str,cmd)),flush=True)
              return subprocess.run(cmd,text=True,check=check,stdout=subprocess.PIPE if cap else None,stderr=subprocess.PIPE if cap else None)
          def dur(p):
              return float(run(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(p)],True).stdout.strip())
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''): h.update(b)
              return h.hexdigest()
          def at(t):
              cs=int(round(max(0,t)*100)); hh,cs=divmod(cs,360000); mm,cs=divmod(cs,6000); ss,cs=divmod(cs,100)
              return f'{hh}:{mm:02d}:{ss:02d}.{cs:02d}'

          os.environ['ORT_DISABLE_TELEMETRY']='1'; ort.disable_telemetry_events()
          opt=ort.SessionOptions(); opt.intra_op_num_threads=4; opt.inter_op_num_threads=1
          sess=ort.InferenceSession(str(MODEL),sess_options=opt,providers=['CPUExecutionProvider'])
          k=Kokoro.from_session(sess,str(VOICES))
          ph=k.tokenizer.phonemize(SCRIPT,lang='en-us')
          audio,sr,times=k.create_timed(ph,voice='af_heart',speed=0.88,lang='en-us',is_phonemes=True,trim=False,continuous=True)
          assert float(np.max(np.abs(audio))) < 1.0
          sf.write(W/'raw.wav',audio,sr,subtype='PCM_24')

          # Keep the first syllable safe; normalize before determining the real ending.
          run(['ffmpeg','-y','-v','error','-i',str(W/'raw.wav'),'-af',f'adelay={int(HEAD*1000)}','-ar','48000','-ac','2','-c:a','pcm_s24le',str(W/'padded.wav')])
          p1=run(['ffmpeg','-hide_banner','-i',str(W/'padded.wav'),'-af','loudnorm=I=-15:TP=-2:LRA=7:print_format=json','-f','null','-'],True)
          m=re.findall(r'\{\s*"input_i".*?\}',p1.stderr,re.S); assert m
          z=json.loads(m[-1])
          lf=(f"loudnorm=I=-15:TP=-2:LRA=7:measured_I={z['input_i']}:measured_LRA={z['input_lra']}:measured_TP={z['input_tp']}:measured_thresh={z['input_thresh']}:offset={z['target_offset']}:linear=true")
          run(['ffmpeg','-y','-v','error','-i',str(W/'padded.wav'),'-af',lf,'-ar','48000','-ac','2','-c:a','pcm_s24le',str(W/'voice_norm.wav')])

          raw_total=dur(W/'voice_norm.wav')
          sd=run(['ffmpeg','-hide_banner','-i',str(W/'voice_norm.wav'),'-af','silencedetect=n=-45dB:d=0.12','-f','null','-'],True,False)
          starts=[float(x) for x in re.findall(r'silence_start: ([0-9.]+)',sd.stderr)]
          tail_start=max([x for x in starts if x>raw_total*0.75], default=None)
          total=min(raw_total, (tail_start+.10) if tail_start is not None else raw_total)
          assert 18.0 <= total <= 23.5, (raw_total,total,tail_start)
          run(['ffmpeg','-y','-v','error','-i',str(W/'voice_norm.wav'),'-t',f'{total:.3f}','-c:a','pcm_s24le',str(W/'voice.wav')])
          print('FINAL VOICE DURATION',total,'raw',raw_total,'tail_start',tail_start)

          td=[dataclasses.asdict(t) for t in times]
          known=k.tokenizer.known(ph); cursor=0; cues=[]
          for spoken,display in CUES:
              s=SCRIPT.find(spoken,cursor); assert s>=0,(spoken,cursor); cursor=s+len(spoken)
              pfx=SCRIPT[:s]
              pph=k.tokenizer.known(k.tokenizer.phonemize(pfx,lang='en-us')) if pfx.strip() else ''
              cph=k.tokenizer.known(k.tokenizer.phonemize(spoken,lang='en-us'))
              guess=len(pph); pos=known.find(cph,max(0,guess-50),min(len(known),guess+len(cph)+50))
              if pos<0:
                  pos=int(round((s/max(1,len(SCRIPT)))*len(td))); plen=max(1,int(round((len(spoken)/len(SCRIPT))*len(td))))
              else:
                  plen=max(1,len(cph))
              pos=max(0,min(pos,len(td)-1)); ei=max(pos,min(pos+plen-1,len(td)-1))
              cues.append([float(td[pos]['start'])+HEAD,float(td[ei]['end'])+HEAD,display])
          for i in range(len(cues)-1): cues[i][1]=max(cues[i][1],cues[i+1][0]-.03)
          cues[-1][1]=min(total-.02,max(cues[-1][1],total-.11))

          ass=W/'captions.ass'
          ass.write_text('[Script Info]\nScriptType: v4.00+\nPlayResX: 1080\nPlayResY: 1920\nWrapStyle: 2\nScaledBorderAndShadow: yes\nYCbCr Matrix: TV.709\n\n[V4+ Styles]\nFormat: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding\nStyle: Caption,DejaVu Sans,60,&H00FFFFFF,&H00FFFFFF,&H00000000,&H50000000,-1,0,0,0,100,100,0,0,1,7,1,5,55,170,20,1\n\n[Events]\nFormat: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text\n'+''.join(f'Dialogue: 0,{at(s)},{at(e)},Caption,,0,0,0,,{{\\an5\\pos(500,1260)}}{txt}\n' for s,e,txt in cues),encoding='utf-8')

          # Narration-aligned visual changes. Different real NOAA source moments for each beat.
          midwalk=(cues[4][0]+cues[4][1])/2
          bounds=[0.0,cues[2][0],cues[3][0],cues[4][0],midwalk,cues[5][0],cues[6][0],cues[7][0],cues[8][0],total]
          ds=[max(.55,bounds[i+1]-bounds[i]) for i in range(9)]
          # absorb rounding into final shot
          ds[-1]=total-sum(ds[:-1])
          assert ds[-1]>.7, ds

          chains=[]; labels=[]
          for i,(s,d,w,xr) in enumerate(zip(STARTS,ds,WIDTHS,XRAT)):
              # Full-height blurred real-footage background.
              chains.append(f'[0:v]trim=start={s:.3f}:duration={d:.3f},setpts=PTS-STARTPTS,fps=30,scale=1080:1920:force_original_aspect_ratio=increase:flags=lanczos,crop=1080:1920,gblur=sigma=26:steps=2,setsar=1[bg{i}]')
              # Larger sharp subject layer; scale varies by shot so the fish occupies more of the phone screen.
              chains.append(f'[0:v]trim=start={s:.3f}:duration={d:.3f},setpts=PTS-STARTPTS,fps=30,scale={w}:-2:flags=lanczos,crop=1080:ih:(iw-1080)*{xr:.2f}:0,setsar=1[fg{i}]')
              chains.append(f'[bg{i}][fg{i}]overlay=x=0:y=(H-h)/2:shortest=1[v{i}]')
              labels.append(f'[v{i}]')
          chains.append(''.join(labels)+f'concat=n={len(ds)}:v=1:a=0[base]')

          fontb='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'; fontr='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          chains.append("[base]drawbox=x=42:y=56:w=360:h=38:color=0x242424@0.67:t=fill,drawbox=x=42:y=98:w=360:h=29:color=0x242424@0.60:t=fill,"+f"drawtext=fontfile='{fontb}':text='STRANGE, BUT VERIFIED':x=52:y=63:fontsize=22:fontcolor=white,"+f"drawtext=fontfile='{fontr}':text='NOAA OCEAN EXPLORATION • EX1702':x=52:y=104:fontsize=15:fontcolor=white@0.92,"+f"subtitles=filename='{ass}':fontsdir='/usr/share/fonts/truetype/dejavu'[vout]")
          fc=';'.join(chains)

          run(['ffmpeg','-y','-v','warning','-i',str(SRC),'-i',str(W/'voice.wav'),'-filter_complex',fc,'-map','[vout]','-map','1:a:0',
               '-c:v','libx264','-preset','medium','-profile:v','high','-level:v','4.2','-b:v','12M','-maxrate','15M','-bufsize','24M',
               '-pix_fmt','yuv420p','-r','30','-g','15','-keyint_min','15','-sc_threshold','0','-flags','+cgop',
               '-color_primaries','bt709','-color_trc','bt709','-colorspace','bt709',
               '-c:a','aac','-b:a','384k','-ar','48000','-ac','2','-t',f'{total:.3f}','-movflags','+faststart',str(FINAL)])

          # Technical QA
          dec=run(['ffmpeg','-v','error','-xerror','-i',str(FINAL),'-f','null','-'],True,False)
          assert dec.returncode==0 and not dec.stderr.strip(), dec.stderr
          probe=json.loads(run(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(FINAL)],True).stdout)
          vv=next(x for x in probe['streams'] if x['codec_type']=='video'); aa=next(x for x in probe['streams'] if x['codec_type']=='audio')
          assert int(vv['width'])==1080 and int(vv['height'])==1920 and vv['codec_name']=='h264' and aa['codec_name']=='aac'
          assert vv.get('profile')=='High' and vv.get('pix_fmt')=='yuv420p'
          loud=run(['ffmpeg','-hide_banner','-i',str(FINAL),'-af','loudnorm=I=-15:TP=-2:LRA=7:print_format=json','-f','null','-'],True,False)
          lm=re.findall(r'\{\s*"input_i".*?\}',loud.stderr,re.S); lm=json.loads(lm[-1]) if lm else {}
          black=run(['ffmpeg','-hide_banner','-i',str(FINAL),'-vf','blackdetect=d=0.10:pix_th=0.10','-an','-f','null','-'],True,False)
          be=[x for x in black.stderr.splitlines() if 'black_start:' in x]
          sil=run(['ffmpeg','-hide_banner','-i',str(FINAL),'-af','silencedetect=n=-45dB:d=0.20','-f','null','-'],True,False)
          se=[x for x in sil.stderr.splitlines() if 'silence_' in x]

          meta={'duration':dur(FINAL),'video':vv,'audio':aa,'loudness':lm,'blackdetect_events':be,'silence_events':se,
                'sha256':sha(FINAL),'source_ranges':STARTS,'foreground_widths':WIDTHS,'caption_y':1260,
                'voice':'af_heart','speed':0.88,'lang':'en-us','continuous':True,'trim':False,'script':SCRIPT,'shot_durations':ds}
          (Q/'technical_qa.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          (Q/'QA_REPORT.txt').write_text(
              f"PASS full decode\n1080x1920 / 30 fps / H.264 High / AAC 48k stereo\nDuration: {meta['duration']:.3f}s\nLoudness: {lm.get('input_i')} LUFS\nTrue peak: {lm.get('input_tp')} dBTP\nBlackdetect events: {len(be)}\nCaption center Y: 1260\nSharp layer heights approx: 1238-1800 px\nSHA256: {meta['sha256']}\n",
              encoding='utf-8')

          # Visual QA: opening, whole film, ending and exact beat frames.
          run(['ffmpeg','-y','-v','error','-i',str(FINAL),'-vf','fps=2,scale=300:-2,tile=4x4:padding=8:margin=8','-frames:v','1',str(Q/'opening_8s.jpg')])
          run(['ffmpeg','-y','-v','error','-i',str(FINAL),'-vf','fps=1,scale=240:-2,tile=5x4:padding=8:margin=8','-frames:v','1',str(Q/'full_1s.jpg')])
          st=max(0,total-4.0)
          run(['ffmpeg','-y','-v','error','-ss',f'{st:.3f}','-i',str(FINAL),'-vf','fps=2,scale=300:-2,tile=4x2:padding=8:margin=8','-frames:v','1',str(Q/'ending_4s.jpg')])
          for j,t in enumerate(bounds[:-1]):
              run(['ffmpeg','-y','-v','error','-ss',f'{min(total-.05,t+.18):.3f}','-i',str(FINAL),'-frames:v','1','-q:v','2',str(Q/f'beat_{j:02d}.jpg')])
          PY
          python work/render_v3.py

      - name: Upload final and QA
        uses: actions/upload-artifact@v4
        with:
          name: SBV-Armored-Searobin-FINAL-V3
          path: |
            work/out/SBV_Armored_Searobin_FINAL_YouTube_V3.mp4
            work/qa/
          retention-days: 1
          compression-level: 0
