name: Build NurseStudy v0.10 Audited Pharmacology APK

on:
  push:
    branches:
      - nursestudy-farmakologia-audit-v010
    paths:
      - '.github/workflows/build-nursestudy-apk.yml'
      - 'nursestudy-build/v09bridge.b64.part00'
      - 'nursestudy-build/v09bridge.b64.part01'
      - 'nursestudy-build/v09bridge.b64.part02'
      - 'nursestudy-build/v010patch.b64.part00'
      - 'nursestudy-build/v010patch.b64.part01'
      - 'nursestudy-build/v010patch.b64.part02'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Restore v0.9 and apply audited v0.10 Pharmacology
        shell: bash
        run: |
          set -euo pipefail
          cat nursestudy-build/v04ads.part00 nursestudy-build/v04ads.part01 nursestudy-build/v04ads.part02 nursestudy-build/v04ads.part03 nursestudy-build/v04ads.part04 > /tmp/nursestudy_v04.b64
          test "$(wc -c < /tmp/nursestudy_v04.b64)" -eq 66996
          base64 -d /tmp/nursestudy_v04.b64 > /tmp/NurseStudy_v04_Android_source.zip
          echo "65fcf2991ab03488bac9264bc1d2dfcd38bfc3f0cc50df87f8b6d7e101f5ac75  /tmp/NurseStudy_v04_Android_source.zip" | sha256sum -c -
          rm -rf NurseStudy_v04_Android /tmp/nursestudy_v04
          mkdir -p /tmp/nursestudy_v04
          unzip -q /tmp/NurseStudy_v04_Android_source.zip -d /tmp/nursestudy_v04
          cp -a /tmp/nursestudy_v04/NurseStudy_v04_Android ./NurseStudy_v04_Android

          cat nursestudy-build/v05patch.part00 nursestudy-build/v05patch.part01 nursestudy-build/v05patch.part02 nursestudy-build/v05patch.part03 > /tmp/nursestudy_v05.patch
          test "$(wc -c < /tmp/nursestudy_v05.patch)" -eq 24882
          patch -p4 < /tmp/nursestudy_v05.patch

          cat nursestudy-build/v06patchpy.part00 nursestudy-build/v06patchpy.part01 nursestudy-build/v06patchpy.part02 nursestudy-build/v06patchpy.part03 nursestudy-build/v06patchpy.part04 > /tmp/v06_patch.py
          cat nursestudy-build/v06p05b64.00 nursestudy-build/v06p05b64.01 > /tmp/v06_part05.b64
          base64 -d /tmp/v06_part05.b64 >> /tmp/v06_patch.py
          test "$(wc -c < /tmp/v06_patch.py)" -eq 48233
          echo "ff47d3195b0892b13ff8ce993ff6ec40aebccbce6a2dc35dfa784aa3681915cb  /tmp/v06_patch.py" | sha256sum -c -

          cd NurseStudy_v04_Android
          python3 /tmp/v06_patch.py
          echo "9e61bf1baba1bad051634d268b4d75165f98e294371ec67ac28e662edbfe1012  ../nursestudy-build/v07_patch.py" | sha256sum -c -
          python3 ../nursestudy-build/v07_patch.py

          cd ..
          head -c 8000 nursestudy-build/v08content.part00 > /tmp/v08content.b64
          cat nursestudy-build/v08content.part01 nursestudy-build/v08content.part02 nursestudy-build/v08content.part03 nursestudy-build/v08content.part04 nursestudy-build/v08content.part05 >> /tmp/v08content.b64
          test "$(wc -c < /tmp/v08content.b64)" -eq 46004
          echo "54f801cc58a8266c0f9c096df114391ec66c850b0408d066a8f7f7bb7270ec31  /tmp/v08content.b64" | sha256sum -c -
          base64 -d /tmp/v08content.b64 | gzip -d > NurseStudy_v04_Android/app/src/main/assets/www/content-data.js
          echo "4dc4fe1f4e3276d6dda937affb36f92878fb731267ebe9420966b660d94ea7df  NurseStudy_v04_Android/app/src/main/assets/www/content-data.js" | sha256sum -c -

          cd NurseStudy_v04_Android
          sed -i 's/versionCode 7/versionCode 8/' app/build.gradle
          sed -i "s/versionName '0.7.0-test'/versionName '0.8.0-test'/" app/build.gradle
          sed -i 's/nursestudy-v7-content-arch/nursestudy-v8-interna/' app/src/main/assets/www/sw.js
          cd ..

          cat nursestudy-build/v09bridge.b64.part00 nursestudy-build/v09bridge.b64.part01 nursestudy-build/v09bridge.b64.part02 | tr -d '\r\n' > /tmp/v09_bridge.py.gz.b64
          test "$(wc -c < /tmp/v09_bridge.py.gz.b64)" -eq 13364
          echo "a493bbbf4f82ec5b4e190da29de922e99ddecce70a79c43158bb7872debd4031  /tmp/v09_bridge.py.gz.b64" | sha256sum -c -
          base64 -d /tmp/v09_bridge.py.gz.b64 | gzip -d > /tmp/v09_bridge.py
          test "$(wc -c < /tmp/v09_bridge.py)" -eq 13321
          echo "bd7602ae45ed9b6cb22369fbeaf2c5bf0b8c2dd75fa71c37e5adf5cf0cf44e13  /tmp/v09_bridge.py" | sha256sum -c -

          cd NurseStudy_v04_Android
          python3 /tmp/v09_bridge.py
          node --check app/src/main/assets/www/content-data.js
          echo "64165cee710dba45d593124c8c62a4536bf53a7ca59692336162890783a2ae2e  app/src/main/assets/www/content-data.js" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          s=Path('app/src/main/assets/www/content-data.js').read_text()
          m=re.search(r"window\.NS_CONTENT\s*=\s*(\{.*\});\s*\n\}\)\(\);?\s*$",s,re.S)
          if not m: raise SystemExit('v0.9 NS_CONTENT parse failure')
          db=json.loads(m.group(1))
          canonical=json.dumps(db,sort_keys=True,ensure_ascii=False,separators=(',',':')).encode()
          digest=hashlib.sha256(canonical).hexdigest()
          if digest != '150d84d9c72be9c22afce257b0642c937d948b44071a0df7a3780eef01257f9c':
              raise SystemExit(f'v0.9 canonical mismatch: {digest}')
          if db.get('AUDIT_META',{}).get('version') != 'v0.9-claim-audit':
              raise SystemExit('Interna audit metadata missing after bridge')
          print('v0.9 bridge canonical SHA256:', digest)
          PY
          cd ..

          cat nursestudy-build/v010patch.b64.part00 nursestudy-build/v010patch.b64.part01 nursestudy-build/v010patch.b64.part02 | tr -d '\r\n' > /tmp/v010_patch.py.gz.b64
          test "$(wc -c < /tmp/v010_patch.py.gz.b64)" -eq 13372
          echo "8c67387ae244e8643990a56ed01ceb22b720f5df01101636c6849867d5364912  /tmp/v010_patch.py.gz.b64" | sha256sum -c -
          base64 -d /tmp/v010_patch.py.gz.b64 | gzip -d > /tmp/v010_pharm_audit_patch.py
          test "$(wc -c < /tmp/v010_pharm_audit_patch.py)" -eq 13333
          echo "a81a9ebe92a8bf40a7cdf6b938b0df3aff4cc61c073960f0fef3941707e25500  /tmp/v010_pharm_audit_patch.py" | sha256sum -c -

          cd NurseStudy_v04_Android
          python3 /tmp/v010_pharm_audit_patch.py
          node --check app/src/main/assets/www/content-data.js
          node --check app/src/main/assets/www/app.js
          node tools/validate-content.mjs
          echo "6642505a3bef15a6dd96a7de0dcdc83e375d1e87dc75b052c560d627a61c598e  app/src/main/assets/www/content-data.js" | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib,collections
          s=Path('app/src/main/assets/www/content-data.js').read_text()
          m=re.search(r"window\.NS_CONTENT\s*=\s*(\{.*\});\s*\n\}\)\(\);?\s*$",s,re.S)
          if not m: raise SystemExit('v0.10 NS_CONTENT parse failure')
          db=json.loads(m.group(1))
          canonical=json.dumps(db,sort_keys=True,ensure_ascii=False,separators=(',',':')).encode()
          digest=hashlib.sha256(canonical).hexdigest()
          expected='92afd4f48b628a8ab0011caf81021dce3cd69d5338ddc8142852133c64f757f0'
          if digest != expected: raise SystemExit(f'Canonical pharmacology audit mismatch: {digest}')
          q=[x for x in db['QUESTIONS'] if x['subject']=='farmakologia']
          f=[x for x in db['FLASHCARDS'] if x['subject']=='farmakologia']
          l=db['LESSONS'].get('farmakologia',[])
          if (len(q),len(f),len(l)) != (60,8,5): raise SystemExit(f'Farmakologia counts invalid: {len(q)}/{len(f)}/{len(l)}')
          if len(db['MEDICAL_SOURCES']) != 59: raise SystemExit(f"Expected 59 medical sources, got {len(db['MEDICAL_SOURCES'])}")
          if db.get('PHARM_AUDIT_META',{}).get('version') != 'v0.10-pharmacology-claim-audit': raise SystemExit('PHARM_AUDIT_META missing')
          if db.get('AUDIT_META',{}).get('version') != 'v0.9-claim-audit': raise SystemExit('Interna AUDIT_META regression')
          dist=collections.Counter(x['correct'] for x in q)
          if dist != collections.Counter({2:17,1:16,0:14,3:13}): raise SystemExit(f'Answer distribution changed: {dist}')
          print('Audited Pharmacology canonical SHA256:',digest)
          print('Farmakologia:',len(l),'lessons',len(q),'questions',len(f),'flashcards')
          print('Sources:',len(db['MEDICAL_SOURCES']))
          PY

          grep -q "versionCode 10" app/build.gradle
          grep -q "versionName '0.10.0-test'" app/build.gradle
          grep -q "nursestudy-v10-pharm-audit" app/src/main/assets/www/sw.js

      - name: Build debug APK and capture log
        id: gradle_build
        working-directory: NurseStudy_v04_Android
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build-v010.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NurseStudy-v0.10-build-log
          path: gradle-build-v010.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if Gradle failed
        if: steps.gradle_build.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=NurseStudy_v04_Android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          apksigner verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NurseStudy-v0.10-Farmakologia-Audited-AdMob-test-APK
          path: NurseStudy_v04_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
