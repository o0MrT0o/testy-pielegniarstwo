name: Build NurseStudy v0.6 Core UX APK

on:
  push:
    branches:
      - nursestudy-core-v06
    paths:
      - '.github/workflows/build-nursestudy-apk.yml'
      - 'nursestudy-build/v06patchpy.part*'
      - 'nursestudy-build/v06p05b64.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Restore v0.5 and apply v0.6 fixes
        shell: bash
        run: |
          set -euo pipefail
          cat nursestudy-build/v04ads.part00 nursestudy-build/v04ads.part01 nursestudy-build/v04ads.part02 nursestudy-build/v04ads.part03 nursestudy-build/v04ads.part04 > /tmp/nursestudy_v04.b64
          test "$(wc -c < /tmp/nursestudy_v04.b64)" -eq 66996
          base64 -d /tmp/nursestudy_v04.b64 > /tmp/NurseStudy_v04_Android_source.zip
          echo "65fcf2991ab03488bac9264bc1d2dfcd38bfc3f0cc50df87f8b6d7e101f5ac75  /tmp/NurseStudy_v04_Android_source.zip" | sha256sum -c -
          unzip -t /tmp/NurseStudy_v04_Android_source.zip >/dev/null
          rm -rf NurseStudy_v04_Android /tmp/nursestudy_v04
          mkdir -p /tmp/nursestudy_v04
          unzip -q /tmp/NurseStudy_v04_Android_source.zip -d /tmp/nursestudy_v04
          cp -a /tmp/nursestudy_v04/NurseStudy_v04_Android ./NurseStudy_v04_Android

          cat nursestudy-build/v05patch.part00 nursestudy-build/v05patch.part01 nursestudy-build/v05patch.part02 nursestudy-build/v05patch.part03 > /tmp/nursestudy_v05.patch
          test "$(wc -c < /tmp/nursestudy_v05.patch)" -eq 24882
          patch -p4 < /tmp/nursestudy_v05.patch

          cat nursestudy-build/v06patchpy.part00 nursestudy-build/v06patchpy.part01 nursestudy-build/v06patchpy.part02 nursestudy-build/v06patchpy.part03 nursestudy-build/v06patchpy.part04 > /tmp/v06_patch.py
          cat nursestudy-build/v06p05b64.00 nursestudy-build/v06p05b64.01 > /tmp/v06_part05.b64
          test "$(wc -c < /tmp/v06_part05.b64)" -eq 4312
          base64 -d /tmp/v06_part05.b64 >> /tmp/v06_patch.py
          test "$(wc -c < /tmp/v06_patch.py)" -eq 48233
          echo "ff47d3195b0892b13ff8ce993ff6ec40aebccbce6a2dc35dfa784aa3681915cb  /tmp/v06_patch.py" | sha256sum -c -

          cd NurseStudy_v04_Android
          python3 /tmp/v06_patch.py
          node --check app/src/main/assets/www/app.js
          grep -q "versionCode 6" app/build.gradle
          grep -q "versionName '0.6.0-test'" app/build.gradle
          grep -q "play-services-ads:25.5.0" app/build.gradle
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q "window.NurseStudyNavigation" app/src/main/assets/www/app.js
          grep -q "setAdsEnabled" app/src/main/java/pl/nursestudy/app/MainActivity.java
          grep -q "setBannerVisible" app/src/main/java/pl/nursestudy/app/MainActivity.java
          grep -q "nursestudy-v6-core" app/src/main/assets/www/sw.js

      - name: Build debug APK and capture log
        id: gradle_build
        working-directory: NurseStudy_v04_Android
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build-v06.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NurseStudy-v0.6-build-log
          path: gradle-build-v06.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if Gradle failed
        if: steps.gradle_build.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=NurseStudy_v04_Android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          apksigner verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NurseStudy-v0.6-CoreUX-AdMob-test-APK
          path: NurseStudy_v04_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
