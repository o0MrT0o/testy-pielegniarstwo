name: Build NurseStudy v0.8 Interna APK

on:
  push:
    branches:
      - nursestudy-interna-v08
    paths:
      - '.github/workflows/build-nursestudy-apk.yml'
      - 'nursestudy-build/v08content.part*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Restore v0.7 and install verified Interna content
        shell: bash
        run: |
          set -euo pipefail
          cat nursestudy-build/v04ads.part00 nursestudy-build/v04ads.part01 nursestudy-build/v04ads.part02 nursestudy-build/v04ads.part03 nursestudy-build/v04ads.part04 > /tmp/nursestudy_v04.b64
          test "$(wc -c < /tmp/nursestudy_v04.b64)" -eq 66996
          base64 -d /tmp/nursestudy_v04.b64 > /tmp/NurseStudy_v04_Android_source.zip
          echo "65fcf2991ab03488bac9264bc1d2dfcd38bfc3f0cc50df87f8b6d7e101f5ac75  /tmp/NurseStudy_v04_Android_source.zip" | sha256sum -c -
          rm -rf NurseStudy_v04_Android /tmp/nursestudy_v04
          mkdir -p /tmp/nursestudy_v04
          unzip -q /tmp/NurseStudy_v04_Android_source.zip -d /tmp/nursestudy_v04
          cp -a /tmp/nursestudy_v04/NurseStudy_v04_Android ./NurseStudy_v04_Android

          cat nursestudy-build/v05patch.part00 nursestudy-build/v05patch.part01 nursestudy-build/v05patch.part02 nursestudy-build/v05patch.part03 > /tmp/nursestudy_v05.patch
          test "$(wc -c < /tmp/nursestudy_v05.patch)" -eq 24882
          patch -p4 < /tmp/nursestudy_v05.patch

          cat nursestudy-build/v06patchpy.part00 nursestudy-build/v06patchpy.part01 nursestudy-build/v06patchpy.part02 nursestudy-build/v06patchpy.part03 nursestudy-build/v06patchpy.part04 > /tmp/v06_patch.py
          cat nursestudy-build/v06p05b64.00 nursestudy-build/v06p05b64.01 > /tmp/v06_part05.b64
          base64 -d /tmp/v06_part05.b64 >> /tmp/v06_patch.py
          test "$(wc -c < /tmp/v06_patch.py)" -eq 48233
          echo "ff47d3195b0892b13ff8ce993ff6ec40aebccbce6a2dc35dfa784aa3681915cb  /tmp/v06_patch.py" | sha256sum -c -

          cd NurseStudy_v04_Android
          python3 /tmp/v06_patch.py
          echo "9e61bf1baba1bad051634d268b4d75165f98e294371ec67ac28e662edbfe1012  ../nursestudy-build/v07_patch.py" | sha256sum -c -
          python3 ../nursestudy-build/v07_patch.py

          cd ..
          # part00 acquired one transport byte on upload; retain only the exact 8000-byte payload chunk.
          head -c 8000 nursestudy-build/v08content.part00 > /tmp/v08content.b64
          cat nursestudy-build/v08content.part01 nursestudy-build/v08content.part02 nursestudy-build/v08content.part03 nursestudy-build/v08content.part04 nursestudy-build/v08content.part05 >> /tmp/v08content.b64
          test "$(wc -c < /tmp/v08content.b64)" -eq 46004
          echo "54f801cc58a8266c0f9c096df114391ec66c850b0408d066a8f7f7bb7270ec31  /tmp/v08content.b64" | sha256sum -c -
          base64 -d /tmp/v08content.b64 | gzip -d > NurseStudy_v04_Android/app/src/main/assets/www/content-data.js
          echo "4dc4fe1f4e3276d6dda937affb36f92878fb731267ebe9420966b660d94ea7df  NurseStudy_v04_Android/app/src/main/assets/www/content-data.js" | sha256sum -c -

          cd NurseStudy_v04_Android
          sed -i 's/versionCode 7/versionCode 8/' app/build.gradle
          sed -i "s/versionName '0.7.0-test'/versionName '0.8.0-test'/" app/build.gradle
          sed -i 's/nursestudy-v7-content-arch/nursestudy-v8-interna/' app/src/main/assets/www/sw.js
          node --check app/src/main/assets/www/content-data.js
          node --check app/src/main/assets/www/app.js
          node tools/validate-content.mjs
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const c={window:{}};vm.createContext(c);vm.runInContext(fs.readFileSync('app/src/main/assets/www/content-data.js','utf8'),c);
          const d=c.window.NS_CONTENT;
          const q=d.QUESTIONS.filter(x=>x.subject==='interna');
          const f=d.FLASHCARDS.filter(x=>x.subject==='interna');
          const l=d.LESSONS.interna||[];
          if(q.length!==60||f.length!==30||l.length!==16) throw new Error(`Interna counts invalid: ${q.length}/${f.length}/${l.length}`);
          const dist=[0,0,0,0]; q.forEach(x=>dist[x.correct]++);
          if(dist.join(',')!=='15,15,15,15') throw new Error(`Answer distribution invalid: ${dist}`);
          console.log('Interna verified:', {questions:q.length,flashcards:f.length,lessons:l.length,correctDistribution:dist});
          NODE
          grep -q "versionCode 8" app/build.gradle
          grep -q "versionName '0.8.0-test'" app/build.gradle
          grep -q "nursestudy-v8-interna" app/src/main/assets/www/sw.js

      - name: Build debug APK and capture log
        id: gradle_build
        working-directory: NurseStudy_v04_Android
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build-v08.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NurseStudy-v0.8-build-log
          path: gradle-build-v08.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if Gradle failed
        if: steps.gradle_build.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=NurseStudy_v04_Android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          apksigner verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NurseStudy-v0.8-Interna-AdMob-test-APK
          path: NurseStudy_v04_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
