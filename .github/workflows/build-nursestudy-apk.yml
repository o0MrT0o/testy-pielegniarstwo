name: Build NurseStudy v0.4 AdMob APK

on:
  push:
    branches:
      - nursestudy-ads-v04
    paths:
      - '.github/workflows/build-nursestudy-apk.yml'
      - 'nursestudy-build/v04ads.part*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Restore exact v0.4 Android project
        shell: bash
        run: |
          set -euo pipefail
          cat nursestudy-build/v04ads.part00 \
              nursestudy-build/v04ads.part01 \
              nursestudy-build/v04ads.part02 \
              nursestudy-build/v04ads.part03 \
              nursestudy-build/v04ads.part04 > /tmp/nursestudy_v04.b64
          test "$(wc -c < /tmp/nursestudy_v04.b64)" -eq 66996
          base64 -d /tmp/nursestudy_v04.b64 > /tmp/NurseStudy_v04_Android_source.zip
          echo "65fcf2991ab03488bac9264bc1d2dfcd38bfc3f0cc50df87f8b6d7e101f5ac75  /tmp/NurseStudy_v04_Android_source.zip" | sha256sum -c -
          unzip -t /tmp/NurseStudy_v04_Android_source.zip >/dev/null
          rm -rf NurseStudy_v04_Android /tmp/nursestudy_v04
          mkdir -p /tmp/nursestudy_v04
          unzip -q /tmp/NurseStudy_v04_Android_source.zip -d /tmp/nursestudy_v04
          cp -a /tmp/nursestudy_v04/NurseStudy_v04_Android ./NurseStudy_v04_Android
          test -f NurseStudy_v04_Android/app/build.gradle
          test -f NurseStudy_v04_Android/app/src/main/java/pl/nursestudy/app/MainActivity.java

      - name: Build debug APK
        working-directory: NurseStudy_v04_Android
        shell: bash
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=NurseStudy_v04_Android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          apksigner verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NurseStudy-v0.4-AdMob-test-APK
          path: NurseStudy_v04_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
