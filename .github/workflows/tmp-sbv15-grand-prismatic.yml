name: SBV15 Grand Prismatic FINAL

on:
  push:
    branches:
      - tmp/sbv15-af-heart
    paths:
      - 'sbv15/**'
      - '.github/workflows/tmp-sbv15-grand-prismatic.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MASTER_URL: "https://media.descriptusercontent.com/v2/proxy/remux?url=https%3A%2F%2Fapi.descript.com%2Fv2%2Fpublished_projects%2Feaaacdcb-64a0-4931-85ec-43e98ea78a59%2Fhls%3Fexpiration%3D1791224110892%26signature%3Db96eb5ae0124356b2eba1a9b8628fbfc1e107a4bee17f28f162d97b9282f49e4&filename=Grand+Prismatic+vertical+master.mp4&mediaCacheBucketName=production-273614-media-cache&expiration=1791220511&signature=652fb39d875bd8f7b5f1ff673d9f396d8ab5d44caf7b87fc05062f443604b744"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kokoro and media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install kokoro-onnx soundfile espeakng-loader

      - name: Download exact Kokoro model and visual master
        run: |
          mkdir -p sbv15/build sbv15/model
          curl -L --fail --retry 3 -o sbv15/model/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -L --fail --retry 3 -o sbv15/model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          echo "beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  sbv15/model/kokoro-v1.0.onnx" | sha256sum -c -
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  sbv15/model/voices-v1.0.bin" | sha256sum -c -
          curl -L --fail --retry 3 --retry-delay 2 -o sbv15/build/visual_master.mp4 "$MASTER_URL"
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height,r_frame_rate -of json sbv15/build/visual_master.mp4

      - name: Generate exact af_heart narration and timed captions
        env:
          ORT_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '4'
        run: |
          cat > sbv15/build/generate.py <<'PY'
          from pathlib import Path
          import json, re
          import numpy as np
          import soundfile as sf
          import espeakng_loader
          import onnxruntime as rt
          rt.disable_telemetry_events()
          from kokoro_onnx import Kokoro
          from kokoro_onnx.config import EspeakConfig

          root = Path('sbv15')
          build = root/'build'
          text = (root/'narration.txt').read_text(encoding='utf-8').strip()
          opts = rt.SessionOptions()
          opts.intra_op_num_threads = 4
          opts.inter_op_num_threads = 1
          sess = rt.InferenceSession(str(root/'model/kokoro-v1.0.onnx'), sess_options=opts, providers=['CPUExecutionProvider'])
          engine = Kokoro.from_session(
              sess,
              str(root/'model/voices-v1.0.bin'),
              espeak_config=EspeakConfig(
                  lib_path=espeakng_loader.get_library_path(),
                  data_path=espeakng_loader.get_data_path(),
              ),
          )
          audio, sr = engine.create(
              text,
              voice='af_heart',
              speed=0.95,
              lang='en-us',
              sentence_pause=0.22,
              clause_pause=0.10,
          )
          sf.write(build/'af_heart_final.wav', audio, sr, subtype='PCM_16')
          duration = len(audio) / sr

          chunks = [
              "Those colors aren't paint.",
              "They're alive.",
              "Grand Prismatic Spring",
              "is Yellowstone's largest hot spring,",
              "and its rainbow edges",
              "come from heat-loving microorganisms",
              "called thermophiles.",
              "Different microbes thrive",
              "at different temperatures,",
              "so the colors change",
              "as the water cools",
              "toward the edge.",
              "But the blue center",
              "is different.",
              "Its clear, hotter water",
              "scatters blue light",
              "back toward your eyes.",
              "Strange, but verified."
          ]
          # Weight captions by spoken word count plus punctuation pause.
          weights=[]
          for c in chunks:
              w=len(c.split())
              if re.search(r'[.!?]$', c): w += 1.15
              elif re.search(r'[,;:]$', c): w += 0.55
              weights.append(w)
          lead=0.10
          tail=0.08
          usable=max(0.5,duration-lead-tail)
          total=sum(weights)
          starts=[]; t=lead
          for c,w in zip(chunks,weights):
              seg=usable*w/total
              starts.append((t,min(duration-tail,t+seg),c))
              t += seg

          yellow = {'alive','rainbow','thermophiles','microbes','temperatures','blue','light','verified'}
          def ass_text(s):
              words=s.split()
              out=[]
              for word in words:
                  clean=re.sub(r'[^A-Za-z]','',word).lower()
                  if clean in yellow:
                      out.append(r'{\c&H004FD5FF&}'+word+r'{\c&H00FFFFFF&}')
                  else:
                      out.append(word)
              return ' '.join(out)
          def ts(sec):
              h=int(sec//3600); sec-=h*3600
              m=int(sec//60); sec-=m*60
              s=int(sec); cs=int(round((sec-s)*100))
              if cs>=100: s+=1; cs=0
              return f'{h}:{m:02d}:{s:02d}.{cs:02d}'

          header = """[Script Info]\nScriptType: v4.00+\nPlayResX: 1080\nPlayResY: 1920\nWrapStyle: 2\nScaledBorderAndShadow: yes\n\n[V4+ Styles]\nFormat: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding\nStyle: Default,DejaVu Sans,66,&H00FFFFFF,&H000000FF,&H00141414,&H64000000,-1,0,0,0,100,100,0,0,1,4,1,2,70,70,315,1\n\n[Events]\nFormat: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text\n"""
          events=[]
          for st,en,c in starts:
              events.append(f'Dialogue: 0,{ts(st)},{ts(en)},Default,,0,0,0,,{ass_text(c)}')
          (build/'captions.ass').write_text(header+'\n'.join(events)+'\n',encoding='utf-8')
          meta={'voice':'af_heart','speed':0.95,'sentence_pause':0.22,'clause_pause':0.10,'duration':duration,'sample_rate':sr,'caption_count':len(chunks)}
          (build/'tts_meta.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          print(json.dumps(meta), flush=True)
          PY
          python sbv15/build/generate.py

      - name: Mix, caption and render final Short
        run: |
          set -e
          MASTER=sbv15/build/visual_master.mp4
          VOICE=sbv15/build/af_heart_final.wav
          OUT=sbv15/build/SBV15_Grand_Prismatic_FINAL.mp4
          MDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MASTER")
          HAS_AUDIO=$(ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 "$MASTER" || true)
          if [ -n "$HAS_AUDIO" ]; then
            ffmpeg -y -i "$MASTER" -i "$VOICE" \
              -filter_complex "[0:v]ass=sbv15/build/captions.ass[v];[0:a]volume=0.09[amb];[1:a]loudnorm=I=-16:TP=-1.5:LRA=7,apad[narr];[amb][narr]amix=inputs=2:duration=first:dropout_transition=1.2,alimiter=limit=0.90[a]" \
              -map "[v]" -map "[a]" -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -r 30 \
              -c:a aac -b:a 192k -ar 48000 -ac 2 -t "$MDUR" -movflags +faststart "$OUT"
          else
            ffmpeg -y -i "$MASTER" -i "$VOICE" \
              -filter_complex "[0:v]ass=sbv15/build/captions.ass[v];[1:a]loudnorm=I=-16:TP=-1.5:LRA=7,apad,atrim=0:${MDUR}[a]" \
              -map "[v]" -map "[a]" -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -r 30 \
              -c:a aac -b:a 192k -ar 48000 -ac 2 -t "$MDUR" -movflags +faststart "$OUT"
          fi
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type,width,height,r_frame_rate,sample_rate,channels -of json "$OUT" > sbv15/build/final_probe.json
          sha256sum "$OUT" > sbv15/build/SHA256.txt
          ffmpeg -hide_banner -i "$OUT" -filter_complex ebur128=peak=true -f null - 2> sbv15/build/loudness.txt || true

      - name: Upload finished film
        uses: actions/upload-artifact@v4
        with:
          name: SBV15-Grand-Prismatic-FINAL
          path: |
            sbv15/build/SBV15_Grand_Prismatic_FINAL.mp4
            sbv15/build/af_heart_final.wav
            sbv15/build/captions.ass
            sbv15/build/tts_meta.json
            sbv15/build/final_probe.json
            sbv15/build/SHA256.txt
            sbv15/build/loudness.txt
          retention-days: 3
