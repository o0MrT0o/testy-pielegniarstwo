name: SBV Io Galileo 1996 real plume time-lapse
on:
  push:
    branches: [sbv-space-04-io-20261021]
    paths: ['.github/workflows/sbv-io-galileo.yml']
permissions: {contents: read}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          pip install requests
      - run: |
          cat >/tmp/galileo.py <<'PY'
          import requests,re,html,urllib.parse,os,subprocess
          os.makedirs("out",exist_ok=True)
          url="https://science.nasa.gov/photojournal/io-plume-monitoring-frames-1-36/"
          s=requests.Session();r=s.get(url,timeout=40);r.raise_for_status()
          raw=html.unescape(r.text).replace("\\/","/")
          matches=list(dict.fromkeys(re.findall(r'https?://[^"\'\s<>]+?\.(?:mov|mpg|mpeg|gif|mp4)(?:\?[^"\'\s<>]*)?',raw,re.I)))
          print("URLS",matches[:22],flush=True)
          for i,u in enumerate(matches[:20]):
           if not any(h in urllib.parse.urlparse(u).netloc for h in ["nasa.gov","nasa.gov"]):continue
           try:
            v=s.get(u,timeout=50)
            print("GOT",i,v.status_code,len(v.content),v.headers.get("Content-Type"),flush=True)
            if v.ok and len(v.content)>20000 and not "text/html" in v.headers.get("Content-Type",""):
             ext=u.split("?")[0].split(".")[-1];f=f"out/GALILEO_IO_MONITOR_{i}.{ext}"
             open(f,"wb").write(v.content)
             p=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration,size","-show_entries","stream=width,height","-of","json",f],capture_output=True,text=True)
             print("PROBE",f,p.stdout[:600],flush=True)
           except Exception as e:print("ERR",repr(e),flush=True)
          
          PY
          python /tmp/galileo.py
      - uses: actions/upload-artifact@v4
        with:
          name: SBV_Io_Real_Galileo_1996_TimeLapse
          path: out/
          compression-level: 0
          retention-days: 7
