name: SBV Bennu standard af_heart narration
on:
  push:
    branches: [sbv-bennu-short-2026-10-20]
    paths: ['.github/workflows/sbv-bennu-voice.yml']
permissions: {contents: read}
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup speech runtime
        run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng libsndfile1
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact standard channel TTS and transcript QA
        run: pip install 'kokoro-onnx==0.6.1' soundfile 'faster-whisper>=1.0,<2'
      - name: Download previously verified channel model weights
        run: |
          curl -LfSs --retry 4 --max-time 240 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx' -o kokoro-v1.0.onnx
          curl -LfSs --retry 4 --max-time 240 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' -o voices-v1.0.bin
      - name: Synthesize af_heart 0.88 English-US and automatically verify spoken text
        run: |
          cat > /tmp/sbv_bennu_voice.py <<'PY'
          import os,hashlib,json,numpy as np,soundfile as sf
          from kokoro_onnx import Kokoro
          text="Watch NASA touch this asteroid. The surface gives way. This is real footage from Bennu. The rocks aren't tightly packed. The sampling head sinks into them. Then a burst of nitrogen throws dust and stones across the surface. Later, NASA discovered something astonishing. Without firing its engines to escape, the spacecraft could have kept sinking. Into an asteroid."
          expected={"kokoro-v1.0.onnx":"beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a","voices-v1.0.bin":"bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d"}
          for f,sha in expected.items():
           got=hashlib.file_digest(open(f,"rb"),"sha256").hexdigest()
           print(f,got,flush=True)
           assert got==sha
          k=Kokoro("kokoro-v1.0.onnx","voices-v1.0.bin")
          wave,sr=k.create(text,voice="af_heart",speed=0.88,lang="en-us")
          os.makedirs("out",exist_ok=True)
          sf.write("out/SBV_Bennu_Kokoro_af_heart.wav",wave,sr,subtype="PCM_24")
          open("out/script.txt","w").write(text)
          print("VOICE_DURATION",len(wave)/sr,flush=True)
          assert 17<len(wave)/sr<41
          from faster_whisper import WhisperModel
          w=WhisperModel("tiny.en",device="cpu",compute_type="int8",cpu_threads=2)
          segments,info=w.transcribe("out/SBV_Bennu_Kokoro_af_heart.wav",language="en",word_timestamps=True,beam_size=3,vad_filter=False)
          words=[]
          for seg in segments:
            for word in seg.words or []: words.append(dict(start=round(word.start,3),end=round(word.end,3),word=word.word))
          json.dump(words,open("out/ASR_words.json","w"),indent=2)
          print("ASR:","".join(q["word"] for q in words),flush=True)
          
          PY
          python /tmp/sbv_bennu_voice.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SBV_Bennu_Approved_af_heart_Voice
          path: out/
          retention-days: 7
