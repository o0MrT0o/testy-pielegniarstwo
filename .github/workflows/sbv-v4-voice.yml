name: SBV Bennu V4 exact channel voice
on:
  push:
    branches: [sbv-bennu-v4-diverse-realfootage]
    paths: ['.github/workflows/sbv-v4-voice.yml']
permissions: {contents: read}
jobs:
  narrator:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Install Kokoro v1.0 and Whisper
        run: |
          sudo apt-get update -qq && sudo apt-get install -y espeak-ng libsndfile1
          pip install kokoro-onnx==0.6.1 soundfile faster-whisper
      - name: Download and verify exact channel model
        run: |
          curl -fLsS --retry 4 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx' -o kokoro-v1.0.onnx
          curl -fLsS --retry 4 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' -o voices-v1.0.bin
      - name: Generate single continuous speech track and ASR word timings
        run: |
          cat > /tmp/voice.py <<'PY'
          import os, hashlib, json, soundfile as sf
          from kokoro_onnx import Kokoro
          text="Watch NASA touch this asteroid. Its surface gives way. This is Bennu, filmed by the OSIRIS-REx spacecraft. From above, it looks solid. But the sampling head sinks into loose rubble. Nitrogen gas blows dust and rocks upward. Then the thrusters fire to escape, stirring up even more material. The spacecraft captured the sample and sent it back to Earth. But NASA found something shocking: without that escape burn, the probe could have kept sinking into the asteroid."
          shas={"kokoro-v1.0.onnx":"beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a","voices-v1.0.bin":"bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d"}
          for p,expected in shas.items():
           actual=hashlib.file_digest(open(p,"rb"),"sha256").hexdigest();assert actual==expected,(p,actual)
          voice=Kokoro("kokoro-v1.0.onnx","voices-v1.0.bin")
          samples,rate=voice.create(text,voice="af_heart",speed=0.88,lang="en-us")
          os.makedirs("out",exist_ok=True)
          sf.write("out/SBV_Bennu_V4_af_heart.wav",samples,rate,subtype="PCM_24")
          open("out/transcript.txt","w").write(text)
          print("SPEECH_SECONDS",len(samples)/rate,flush=True)
          from faster_whisper import WhisperModel
          model=WhisperModel("tiny.en",device="cpu",compute_type="int8",cpu_threads=2)
          words=[]
          for seg in model.transcribe("out/SBV_Bennu_V4_af_heart.wav",language="en",word_timestamps=True,beam_size=2,vad_filter=False)[0]:
           for w in seg.words or []:words.append({"text":w.word,"start":round(w.start,2),"end":round(w.end,2)})
          json.dump(words,open("out/words.json","w"),indent=2)
          print("ASR","".join(w["text"] for w in words),flush=True)
          
          PY
          python /tmp/voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: SBV_Bennu_V4_Approved_Narrator
          path: out/
          retention-days: 7
