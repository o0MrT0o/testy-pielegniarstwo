name: SBV21 Red Sprites Premium V4

on:
  push:
    branches: [sbv-render-duobrachium-temp]
    paths:
      - '.github/workflows/sbv-red-sprites-premium-v4.yml'
      - 'sbv_render/apply_sbv21_premium_v4.py'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install production dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libsndfile1
          python -m pip install --upgrade pip
          python -m pip install 'numpy<3' soundfile onnxruntime espeakng-loader 'kokoro-onnx==0.6.1'

      - name: Download locked narrator model
        run: |
          mkdir -p build_sprites/models build_sprites/assets
          curl -L --fail --retry 4 -o build_sprites/models/kokoro-v1.0.onnx 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx'
          curl -L --fail --retry 4 -o build_sprites/models/voices-v1.0.bin 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin'
          echo 'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  build_sprites/models/kokoro-v1.0.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  build_sprites/models/voices-v1.0.bin' | sha256sum -c -

      - name: Download authentic NASA UAF sources
        run: |
          curl -L --fail --retry 4 -o build_sprites/assets/sprite_2012.mp4 'https://svs.gsfc.nasa.gov/vis/a010000/a011000/a011059/ISS-540-MASTER_high.mp4'
          curl -L --fail --retry 4 -o build_sprites/assets/iss_storms.mp4 'https://svs.gsfc.nasa.gov/vis/a030000/a030100/a030180/iss028_nighttime_20110819_720p.mp4'
          curl -L --fail --retry 4 -o build_sprites/assets/sprite_2024.jpg 'https://assets.science.nasa.gov/dynamicimage/assets/science/esd/eo/images/imagerecords/153000/153422/iss071e234765_lrg.jpg?crop=faces%2Cfocalpoint&fit=clip&h=5005&w=7508'
          curl -L --fail --retry 4 -o build_sprites/assets/sprite_1989.jpg 'https://svs.gsfc.nasa.gov/vis/a010000/a011000/a011059/redSprite_1024x576.jpg'
          curl -L --fail --retry 4 -o build_sprites/assets/sprite_triptych.jpg 'https://svs.gsfc.nasa.gov/vis/a010000/a011000/a011059/sprite_triptych_1920x1080.jpg'
          curl -L --fail --retry 4 -o build_sprites/assets/sprite_2012_still.jpg 'https://svs.gsfc.nasa.gov/vis/a010000/a011000/a011059/ISS031-E-10712_still01_1920x1080.jpg'
          curl -L --fail --retry 4 -o build_sprites/assets/thunder.ogg 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Thunderstorm%20after%20hot%20summer%20day%2017%20minutes%2003%20of%2004.ogg'
          for f in build_sprites/assets/sprite_2012.mp4 build_sprites/assets/iss_storms.mp4 build_sprites/assets/sprite_2024.jpg build_sprites/assets/sprite_1989.jpg build_sprites/assets/sprite_triptych.jpg build_sprites/assets/sprite_2012_still.jpg build_sprites/assets/thunder.ogg; do test -s "$f"; done

      - name: Apply premium motion and Shorts safe-zone patch
        run: python sbv_render/apply_sbv21_premium_v4.py

      - name: Render rebuilt master
        env:
          ORT_DISABLE_TELEMETRY: '1'
        run: python sbv_render/render_red_sprites.py

      - name: Add restrained motion-design callouts
        run: |
          mv build_sprites/Strange_But_Verified_21_Red_Sprites_FINAL.mp4 build_sprites/SBV21_PREMIUM_BASE.mp4
          cat > build_sprites/premium_overlay.txt <<'EOF'
          drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ABOVE THE STORM':fontsize=34:fontcolor=white:box=1:boxcolor=black@0.58:boxborderw=16:x=(w-text_w)/2:y=610:enable='between(t,0.70,1.50)',
          drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='NOT IN THE CLOUD':fontsize=34:fontcolor=0xFFD960:box=1:boxcolor=black@0.60:boxborderw=16:x=(w-text_w)/2:y=610:enable='between(t,5.30,6.15)',
          drawbox=x=760:y=600:w=115:h=150:color=white@0.78:t=3:enable='between(t,18.15,19.20)',
          drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SPRITE':fontsize=32:fontcolor=0xFFD960:box=1:boxcolor=black@0.58:boxborderw=12:x=665:y=535:enable='between(t,18.15,19.20)',
          drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='FILMED FROM ORBIT':fontsize=32:fontcolor=white:box=1:boxcolor=black@0.56:boxborderw=14:x=(w-text_w)/2:y=610:enable='between(t,29.35,30.15)',
          drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='THERE ↓':fontsize=34:fontcolor=0xFFD960:box=1:boxcolor=black@0.56:boxborderw=14:x=(w-text_w)/2:y=560:enable='between(t,35.32,35.95)'
          EOF
          ffmpeg -y -hide_banner -loglevel error \
            -i build_sprites/SBV21_PREMIUM_BASE.mp4 \
            -vf "$(tr -d '\n' < build_sprites/premium_overlay.txt)" \
            -map 0:v:0 -map 0:a:0 \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -r 30 \
            -c:a copy -movflags +faststart \
            build_sprites/Strange_But_Verified_21_Red_Sprites_PREMIUM_V4.mp4

      - name: Final technical and visual QA
        run: |
          FINAL=build_sprites/Strange_But_Verified_21_Red_Sprites_PREMIUM_V4.mp4
          ffmpeg -v error -i "$FINAL" -f null - 2> build_sprites/premium_decode.txt
          ffmpeg -hide_banner -i "$FINAL" -af loudnorm=I=-14:TP=-1:LRA=7:print_format=summary -f null - > build_sprites/premium_loudness.txt 2>&1
          ffprobe -v error -show_entries format=duration,bit_rate -show_entries stream=index,codec_name,width,height,r_frame_rate,pix_fmt,sample_rate,channels -of json "$FINAL" > build_sprites/premium_ffprobe.json

          mkdir -p build_sprites/premium_qa
          for t in 0.35 3.85 7.35 10.85 14.35 17.85 21.35 24.85 28.35 31.85 35.55 38.85; do
            ffmpeg -y -hide_banner -loglevel error -ss "$t" -i "$FINAL" -frames:v 1 -vf scale=270:480 "build_sprites/premium_qa/q_${t}.jpg"
          done
          ffmpeg -y -hide_banner -loglevel error \
            -i build_sprites/premium_qa/q_0.35.jpg -i build_sprites/premium_qa/q_3.85.jpg -i build_sprites/premium_qa/q_7.35.jpg -i build_sprites/premium_qa/q_10.85.jpg \
            -i build_sprites/premium_qa/q_14.35.jpg -i build_sprites/premium_qa/q_17.85.jpg -i build_sprites/premium_qa/q_21.35.jpg -i build_sprites/premium_qa/q_24.85.jpg \
            -i build_sprites/premium_qa/q_28.35.jpg -i build_sprites/premium_qa/q_31.85.jpg -i build_sprites/premium_qa/q_35.55.jpg -i build_sprites/premium_qa/q_38.85.jpg \
            -filter_complex 'xstack=inputs=12:layout=0_0|270_0|540_0|810_0|0_480|270_480|540_480|810_480|0_960|270_960|540_960|810_960' \
            -frames:v 1 build_sprites/premium_contact.jpg
          ffmpeg -y -hide_banner -loglevel error -i "$FINAL" -vf 'fps=2,scale=270:480,tile=6x1' -t 3 -frames:v 1 build_sprites/premium_first3.jpg
          ffmpeg -y -hide_banner -loglevel error -ss 34.15 -i "$FINAL" -vf 'fps=4,scale=270:480,tile=12x1' -t 3 -frames:v 1 build_sprites/premium_hero.jpg

          ffmpeg -y -hide_banner -loglevel error -ss 21.50 -i "$FINAL" -frames:v 1 \
            -vf "drawbox=x=0:y=0:w=1080:h=234:color=red@0.16:t=fill,drawbox=x=0:y=1420:w=1080:h=500:color=red@0.18:t=fill,drawbox=x=920:y=234:w=160:h=1186:color=red@0.16:t=fill,drawbox=x=90:y=234:w=770:h=1186:color=0x35d07f@0.85:t=4" \
            build_sprites/shorts_safezone_proof.jpg

          cat > build_sprites/PREMIUM_V4_AUDIT.md <<'EOF'
          # SBV21 Red Sprites — Premium V4 audit

          - Main captions raised to 500 px from the bottom of a 1080×1920 frame.
          - Caption right margin increased to 220 px to clear the Shorts action rail.
          - Brand/source moved below the conservative top UI-risk band.
          - Hook receives restrained camera push-in, not a random effect.
          - Historical 1989 proof and milliseconds sequence receive short micro push-ins.
          - Real 2012 sprite still gets a factual on-screen callout tied to the visible sprite.
          - Hero remains an authentic NASA before → sprite → after sequence.
          - Center hero frame is slightly punched in and is replayed once with an explicit REPLAY label.
          - No synthetic documentary footage or generated reconstruction was introduced.
          - Audio/narrator profile remains Kokoro af_heart @ 0.88 with the documentary breathing moment.
          - shorts_safezone_proof.jpg uses a conservative observed UI mask; YouTube itself does not publish one universal fixed-pixel Shorts safe zone.
          EOF

      - name: Upload premium production package
        uses: actions/upload-artifact@v4
        with:
          name: SBV21-Red-Sprites-PREMIUM-V4
          path: |
            build_sprites/Strange_But_Verified_21_Red_Sprites_PREMIUM_V4.mp4
            build_sprites/Strange_But_Verified_21_Red_Sprites_EN.srt
            build_sprites/PREMIUM_V4_AUDIT.md
            build_sprites/QA.md
            build_sprites/shot_list.md
            build_sprites/sources.md
            build_sprites/metadata.md
            build_sprites/captions.ass
            build_sprites/voice/timing.json
            build_sprites/voice/narration.txt
            build_sprites/premium_decode.txt
            build_sprites/premium_loudness.txt
            build_sprites/premium_ffprobe.json
            build_sprites/premium_contact.jpg
            build_sprites/premium_first3.jpg
            build_sprites/premium_hero.jpg
            build_sprites/shorts_safezone_proof.jpg
            build_sprites/premium_overlay.txt
          retention-days: 5
          if-no-files-found: error
