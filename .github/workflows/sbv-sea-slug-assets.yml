name: SBV sea slug asset build

on:
  push:
    branches:
      - chatgpt-sbv-render-temp

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'kokoro-onnx==0.6.1' onnxruntime soundfile numpy
      - name: Download and verify exact Kokoro assets
        run: |
          mkdir -p build
          curl -L --fail --retry 3 -o build/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -L --fail --retry 3 -o build/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          echo 'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  build/kokoro-v1.0.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  build/voices-v1.0.bin' | sha256sum -c -
      - name: Generate exact af_heart narrator
        run: |
          cat > build/synth.py <<'PY'
          import onnxruntime as ort
          import soundfile as sf
          from kokoro_onnx import Kokoro
          text = "This animal can lose almost its entire body — including its heart — and survive. This is Elysia cf. marginata. After separating at the neck, the head keeps crawling, and young slugs can start eating algae within hours. Within about a week, the heart begins to regenerate. Around twenty days later, the whole body is back. The abandoned body can keep moving, but it never grows a new head. Strange… but verified."
          opt = ort.SessionOptions(); opt.intra_op_num_threads = 4; opt.inter_op_num_threads = 1
          session = ort.InferenceSession('build/kokoro-v1.0.onnx', sess_options=opt, providers=['CPUExecutionProvider'])
          k = Kokoro.from_session(session, 'build/voices-v1.0.bin')
          phonemes = k.tokenizer.phonemize(text, lang='en-us')
          audio, sr, times = k.create_timed(phonemes, voice='af_heart', speed=0.88, lang='en-us', is_phonemes=True, trim=False, continuous=True)
          sf.write('build/narration_raw.wav', audio, sr, subtype='PCM_24')
          open('build/narration.txt','w',encoding='utf-8').write(text)
          open('build/phonemes.txt','w',encoding='utf-8').write(phonemes)
          with open('build/timing.txt','w',encoding='utf-8') as f:
              for t in times: f.write(str(t)+'\n')
          print('sample_rate=', sr, 'samples=', len(audio), 'seconds=', len(audio)/sr)
          PY
          python build/synth.py
          ffmpeg -y -hide_banner -loglevel error -i build/narration_raw.wav -af loudnorm=I=-16:TP=-2:LRA=7 build/narration.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 build/narration.wav > build/narration_duration.txt
      - name: Download authentic source videos
        run: |
          curl -L --fail --retry 3 -o build/elysia_video_s1.mp4 'https://e3w9i7jz9d8.exactdn.com/wp/wp-content/uploads/2021/03/mmc3-480p.mp4'
          curl -L --fail --retry 3 -o build/elysia_3days.mp4 'https://www.scientias.nl/wp-content/uploads/2021/03/The-head-and-the-body-of-Elysia-cf-marginata-3-days-after-autotomy-The-head-moves-spontaneously-and-the-body-moves-slightly-reacting-to-contact-stimuli-CREDIT-Sayaka-Mitoh.mp4'
          ffprobe -v error -show_streams -show_format build/elysia_video_s1.mp4 > build/source1_probe.txt
          ffprobe -v error -show_streams -show_format build/elysia_3days.mp4 > build/source2_probe.txt
          printf '%s\n' 'Footage source: Sayaka Mitoh / Nara Women’s University' 'No generated or procedural visuals are included in these source files.' > build/SOURCE_CREDIT.txt
      - name: Create contact sheets
        run: |
          ffmpeg -y -hide_banner -loglevel error -i build/elysia_video_s1.mp4 -vf "fps=1/10,scale=480:-1,tile=4x5" -frames:v 1 build/source1_contact.jpg || true
          ffmpeg -y -hide_banner -loglevel error -i build/elysia_3days.mp4 -vf "fps=1/2,scale=480:-1,tile=4x3" -frames:v 1 build/source2_contact.jpg || true
      - name: Package exact assets
        run: |
          rm -f build/kokoro-v1.0.onnx build/voices-v1.0.bin
          sha256sum build/narration.wav build/elysia_video_s1.mp4 build/elysia_3days.mp4 > build/final_asset_hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sbv-sea-slug-authentic-assets
          path: build/
          retention-days: 1
