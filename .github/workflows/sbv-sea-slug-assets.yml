name: SBV sea slug assets
on:
  push:
    branches: [chatgpt-sbv-render-assets]
  workflow_dispatch:
jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install kokoro-onnx==0.6.1 onnxruntime==1.20.1 soundfile numpy
      - name: Download exact Kokoro model and authentic footage
        run: |
          mkdir -p out/models out/video out/voice
          curl -L --fail --retry 3 -o out/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -L --fail --retry 3 -o out/models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          echo 'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  out/models/kokoro-v1.0.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  out/models/voices-v1.0.bin' | sha256sum -c -
          curl -L --fail --retry 3 -o out/video/elysia_video_s1.mp4 'https://e3w9i7jz9d8.exactdn.com/wp/wp-content/uploads/2021/03/mmc3-480p.mp4'
          curl -L --fail --retry 3 -o out/video/elysia_3days.mp4 'https://www.scientias.nl/wp-content/uploads/2021/03/The-head-and-the-body-of-Elysia-cf-marginata-3-days-after-autotomy-The-head-moves-spontaneously-and-the-body-moves-slightly-reacting-to-contact-stimuli-CREDIT-Sayaka-Mitoh.mp4' || true
          ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of json out/video/elysia_video_s1.mp4 > out/video/source_probe.json
      - name: Generate exact channel narrator
        run: |
          cat > synth.py <<'PY'
          from pathlib import Path
          import os, hashlib, json
          os.environ['ORT_DISABLE_TELEMETRY']='1'
          import onnxruntime as ort
          ort.disable_telemetry_events()
          from kokoro_onnx import Kokoro
          import soundfile as sf
          ROOT=Path('out')
          expected={'kokoro-v1.0.onnx':'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a','voices-v1.0.bin':'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d'}
          for name,sha in expected.items():
              assert hashlib.sha256((ROOT/'models'/name).read_bytes()).hexdigest()==sha
          opt=ort.SessionOptions(); opt.intra_op_num_threads=4; opt.inter_op_num_threads=1
          session=ort.InferenceSession(str(ROOT/'models/kokoro-v1.0.onnx'),sess_options=opt,providers=['CPUExecutionProvider'])
          k=Kokoro.from_session(session,str(ROOT/'models/voices-v1.0.bin'))
          script='''This animal can lose almost its entire body — including its heart — and survive. This is Elysia cf. marginata. After separating at the neck, the head keeps crawling, and young slugs can start eating algae within hours. Within about a week, the heart begins to regenerate. Around three weeks later, the body is back. The abandoned body can keep moving, but it never grows a new head. Strange… but verified.'''
          audio,sr=k.create(script,voice='af_heart',speed=0.88,lang='en-us',trim=False,continuous=True)
          sf.write(ROOT/'voice/narration_raw.wav',audio,sr,subtype='PCM_24')
          meta={'model':'Kokoro-82M v1.0','implementation':'kokoro-onnx==0.6.1','voice':'af_heart','speed':0.88,'lang':'en-us','continuous':True,'trim':False,'sample_rate':sr,'duration':len(audio)/sr,'words':len(script.split()),'sha256':hashlib.sha256((ROOT/'voice/narration_raw.wav').read_bytes()).hexdigest(),'model_sha256':expected['kokoro-v1.0.onnx'],'voices_sha256':expected['voices-v1.0.bin'],'post_synthesis_speed_or_pitch_change':False}
          (ROOT/'voice/provenance.json').write_text(json.dumps(meta,indent=2))
          (ROOT/'voice/narration.txt').write_text(script)
          print(meta)
          PY
          python synth.py
          ffmpeg -y -i out/voice/narration_raw.wav -af loudnorm=I=-16:TP=-2:LRA=7 out/voice/narration.wav
      - name: Make contact sheet for editorial review
        run: |
          mkdir -p out/contact
          ffmpeg -y -i out/video/elysia_video_s1.mp4 -vf "fps=1/10,scale=480:-1,tile=4x5" -frames:v 1 out/contact/contact.jpg || true
      - uses: actions/upload-artifact@v4
        with:
          name: sbv-sea-slug-authentic-assets
          path: out/
          retention-days: 1
