name: SBV Phobos authentic NASA assets
on:
  push:
    branches: [sbv-space03-phobos-2026-10-21]
    paths: ['.github/workflows/sbv-phobos-source.yml']
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          pip install requests
      - name: Download authentic NASA videos from original science pages
        run: |
          cat >/tmp/get.py <<'PY'
          import os,re,html,requests,urllib.parse,json,subprocess
          pages={
           "perseverance_2022":"https://science.nasa.gov/resource/perseverance-rover-sees-solar-eclipse-on-mars/",
           "perseverance_2024":"https://science.nasa.gov/resource/perseverance-captures-transit-of-phobos/",
           "perseverance_2026":"https://science.nasa.gov/photojournal/perseverance-captures-another-phobos-transit/"
          }
          os.makedirs("out",exist_ok=True)
          session=requests.Session();session.headers.update({"User-Agent":"Mozilla/5.0 SBV research documentary"})
          collected=[]
          for name,page in pages.items():
           try:
            response=session.get(page,timeout=40);response.raise_for_status()
            raw=html.unescape(response.text).replace("\\/","/")
            urls=set()
            for u in re.findall(r'https?://[^\"\'\s<>]+?\.(?:mp4|webm|mov)(?:\?[^\"\'\s<>]*)?',raw,re.I):
             urls.add(u.replace("&amp;","&"))
            for u in re.findall(r'(?:src|href|content)=[\"\']([^\"\']+\.(?:mp4|webm|mov)(?:\?[^\"\']*)?)[\"\']',raw,re.I):
             urls.add(urllib.parse.urljoin(page,u))
            filtered=[]
            for u in urls:
             if "nasa.gov" not in urllib.parse.urlparse(u).netloc and "jpl.nasa.gov" not in urllib.parse.urlparse(u).netloc:continue
             try:
              head=session.head(u,allow_redirects=True,timeout=15)
              content=int(head.headers.get("content-length") or "0")
             except Exception as e:content=0
             filtered.append({"url":u,"size":content})
            filtered.sort(key=lambda x:x["size"],reverse=True)
            print("PAGE",name,"candidate_count",len(filtered),json.dumps(filtered[:16]),flush=True)
            collected.extend([{"page":name,**x} for x in filtered])
            for i,ent in enumerate(filtered[:3]):
             if ent["size"] and ent["size"]>115000000:continue
             filename=f"out/{name}_{i}.mp4"
             try:
              with session.get(ent["url"],timeout=100,stream=True) as v:
               v.raise_for_status()
               with open(filename,"wb") as f:
                for c in v.iter_content(1024*1024):
                 if c:f.write(c)
              if os.path.getsize(filename)<25000:os.unlink(filename);continue
              fmt=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration,size","-show_entries","stream=width,height","-of","json",filename],capture_output=True,text=True)
              print("DOWNLOADED",filename,fmt.stdout[:1200],flush=True)
              if i>=1:break
             except Exception as e:print("FAILED",name,i,str(e),flush=True)
           except Exception as e:print("PAGE_ERROR",name,str(e),flush=True)
          json.dump(collected,open("out/media_candidates.json","w"),indent=2)
          
          PY
          python /tmp/get.py
          for f in out/*.mp4; do
            [ -e "$f" ] || continue
            ffmpeg -y -loglevel error -i "$f" -vf "fps=1/3,scale=350:-2,tile=5x3" -frames:v 1 "${f%.mp4}_CONTACT.jpg" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: SBV_SPACE03_Real_Phobos_Eclipses_NASA
          path: out/
          retention-days: 7
          compression-level: 0
