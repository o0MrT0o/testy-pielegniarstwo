name: SBV Documentary Female V2

on:
  push:
    branches: [ chatgpt-sbv-free-voice-v2 ]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Kokoro reference tools
        run: |
          python -m pip install --upgrade pip
          pip install kokoro-onnx==0.6.1 soundfile onnxruntime numpy librosa

      - name: Download Kokoro v1.0
        run: |
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin

      - name: Build low mature original female reference
        run: |
          cat > make_reference.py <<'PY'
          import os
          os.environ['ORT_DISABLE_TELEMETRY']='1'
          import numpy as np
          import soundfile as sf
          import librosa
          import onnxruntime as ort
          ort.disable_telemetry_events()
          from kokoro_onnx import Kokoro

          opt=ort.SessionOptions(); opt.intra_op_num_threads=4; opt.inter_op_num_threads=1
          session=ort.InferenceSession('kokoro-v1.0.onnx',sess_options=opt,providers=['CPUExecutionProvider'])
          k=Kokoro.from_session(session,'voices-v1.0.bin')
          emma=k.get_voice_style('bf_emma')
          george=k.get_voice_style('bm_george')
          voice=emma*0.82 + george*0.18
          text=('In the stillness of the forest, nothing is truly silent. '
                'Beneath the soil, roots exchange water, minerals, and chemical signals through a hidden network. '
                'What looks motionless is alive with communication.')
          audio,sr=k.create(text,voice=voice,speed=0.80,lang='en-gb',trim=False,continuous=True)
          # Shape the synthetic reference itself, not a real person's voice: slightly darker register for a mature documentary timbre.
          audio=librosa.effects.pitch_shift(audio.astype(np.float32),sr=sr,n_steps=-1.15)
          peak=np.max(np.abs(audio))
          if peak>0: audio=audio*(0.82/peak)
          sf.write('SBV_Documentary_Female_V2_REFERENCE.wav',audio,sr,subtype='PCM_24')
          print('reference_seconds',len(audio)/sr)
          PY
          python make_reference.py

      - name: Install Chatterbox
        run: pip install chatterbox-tts

      - name: Generate natural documentary take
        run: |
          cat > make_final.py <<'PY'
          import random, numpy as np, torch
          import torchaudio as ta
          from chatterbox.tts import ChatterboxTTS
          seed=73129
          random.seed(seed); np.random.seed(seed); torch.manual_seed(seed)
          model=ChatterboxTTS.from_pretrained(device='cpu')
          text=('At first glance, the forest seems perfectly still. '
                'But beneath the bark and soil, every tree is connected to a world of signals, water, and shared resources. '
                'The quiet is only an illusion.')
          wav=model.generate(text,
            audio_prompt_path='SBV_Documentary_Female_V2_REFERENCE.wav',
            exaggeration=0.20,
            temperature=0.60,
            cfg_weight=0.52,
            min_p=0.05,
            top_p=0.86,
            repetition_penalty=1.14)
          ta.save('SBV_Documentary_Female_V2_RAW.wav',wav,model.sr)
          print('sample_rate',model.sr,'seconds',wav.shape[-1]/model.sr)
          PY
          python make_final.py

      - name: Master sample
        run: |
          ffmpeg -y -hide_banner -loglevel error -i SBV_Documentary_Female_V2_RAW.wav \
            -af "highpass=f=60,lowpass=f=15000,equalizer=f=170:t=q:w=1.0:g=1.2,equalizer=f=2900:t=q:w=1.0:g=0.5,loudnorm=I=-16:TP=-2:LRA=5" \
            -ar 48000 -ac 1 -c:a pcm_s24le SBV_Documentary_Female_V2.wav
          ffmpeg -y -hide_banner -loglevel error -i SBV_Documentary_Female_V2.wav -c:a libmp3lame -b:a 192k SBV_Documentary_Female_V2.mp3

      - name: Save recipe
        run: |
          cat > SBV_Documentary_Female_V2.json <<'JSON'
          {
            "name": "SBV Documentary Female V2",
            "purpose": "Original low, mature English female documentary narrator for Strange, But Verified",
            "identity_source": "fully synthetic Kokoro blend; no identifiable person's voice used as conditioning audio",
            "kokoro_model": "Kokoro-82M v1.0",
            "kokoro_blend": {"bf_emma": 0.82, "bm_george": 0.18},
            "synthetic_reference_pitch_steps": -1.15,
            "kokoro_speed": 0.80,
            "kokoro_language": "en-gb",
            "humanizer": "Chatterbox TTS",
            "chatterbox_settings": {"exaggeration": 0.20, "temperature": 0.60, "cfg_weight": 0.52, "min_p": 0.05, "top_p": 0.86, "repetition_penalty": 1.14, "seed": 73129},
            "master_target": "-16 LUFS / -2 dBTP"
          }
          JSON

      - uses: actions/upload-artifact@v4
        with:
          name: sbv-documentary-female-v2
          path: |
            SBV_Documentary_Female_V2_REFERENCE.wav
            SBV_Documentary_Female_V2_RAW.wav
            SBV_Documentary_Female_V2.wav
            SBV_Documentary_Female_V2.mp3
            SBV_Documentary_Female_V2.json
          if-no-files-found: error
