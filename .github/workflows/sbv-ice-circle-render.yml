name: SBV Ice Circle Render

on:
  push:
    branches: [main]
    paths:
      - 'sbv_ice_circle/**'
      - '.github/workflows/sbv-ice-circle-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng libespeak-ng1 zip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install kokoro-onnx soundfile numpy faster-whisper espeakng-loader

      - name: Download source video and Kokoro files
        working-directory: sbv_ice_circle
        run: |
          curl -fL --retry 4 --retry-delay 2 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Grand_River_Ice_Circle.webm' -o Grand_River_Ice_Circle.webm
          curl -fL --retry 4 --retry-delay 2 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Vana-vigala_spinning_ice_disk.webm' -o Vana-vigala_spinning_ice_disk.webm
          curl -fL --retry 4 --retry-delay 2 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx' -o kokoro-v1.0.onnx
          curl -fL --retry 4 --retry-delay 2 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' -o voices-v1.0.bin
          echo 'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  kokoro-v1.0.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices-v1.0.bin' | sha256sum -c -

      - name: Render
        working-directory: sbv_ice_circle
        run: python render.py

      - name: Contact sheet
        working-directory: sbv_ice_circle
        run: |
          ffmpeg -y -i out/Strange_But_Verified_Ice_Circle_FINAL.mp4 -vf "fps=1/3.5,scale=270:-2,tile=4x3" -frames:v 1 out/contact_sheet.jpg

      - name: Package
        working-directory: sbv_ice_circle
        run: |
          cd out
          zip -9 SBV_Ice_Circle_FINAL_PACKAGE.zip Strange_But_Verified_Ice_Circle_FINAL.mp4 narration_raw.wav captions.ass QA.md SCRIPT.txt probe.json decode.txt loudness.txt sha256.txt contact_sheet.jpg

      - name: QA output
        working-directory: sbv_ice_circle
        run: |
          cat out/QA.md
          tail -n 30 out/loudness.txt
          test ! -s out/decode.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SBV-Ice-Circle-FINAL
          path: |
            sbv_ice_circle/out/Strange_But_Verified_Ice_Circle_FINAL.mp4
            sbv_ice_circle/out/SBV_Ice_Circle_FINAL_PACKAGE.zip
            sbv_ice_circle/out/contact_sheet.jpg
            sbv_ice_circle/out/QA.md
            sbv_ice_circle/out/probe.json
            sbv_ice_circle/out/loudness.txt
            sbv_ice_circle/out/sha256.txt
          retention-days: 3
          if-no-files-found: error
