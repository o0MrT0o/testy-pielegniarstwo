name: SBV Phobos V2 Hubble real observational timelapses
on:
  push:
    branches: [sbv-space03-phobos-v2-2026-10-21]
    paths: ['.github/workflows/sbv-phobos-v2-hubble.yml']
permissions: {contents: read}
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Install science source tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          pip install requests
      - name: Download authenticated original Hubble observation timelapses
        run: |
          cat >/tmp/source.py <<'PY'
          import os,re,html,requests,urllib.parse,json,subprocess
          pages={
          "hubble_2018_mars_moons":"https://science.nasa.gov/asset/hubble/mars-and-its-moons/",
          "hubble_2017_phobos_raw":"https://science.nasa.gov/asset/hubble/time-lapse-of-phobos-in-orbit-around-mars/",
          "hubble_2017_phobos_smoothed":"https://science.nasa.gov/asset/hubble/time-lapse-of-phobos-in-orbit-around-mars-smoothed/"
          }
          os.makedirs("out",exist_ok=True)
          s=requests.Session();s.headers.update({"User-Agent":"Mozilla/5.0"})
          for key,page in pages.items():
           try:
            r=s.get(page,timeout=25);r.raise_for_status()
            raw=html.unescape(r.text).replace("\\/","/")
            urls=set(re.findall(r'https?://[^\"\'\s<>]+?\.mp4(?:\?[^\"\'\s<>]*)?',raw,re.I))
            urls |= {urllib.parse.urljoin(page,u) for u in re.findall(r'(?:src|href|content)=[\"\']([^\"\']+?\.mp4(?:\?[^\"\']*)?)[\"\']',raw,re.I)}
            # Best-effort large versions: store candidates for verification.
            cand=[]
            for url in urls:
             if not any(x in urllib.parse.urlparse(url).netloc for x in ("nasa.gov","stsci.edu")):continue
             try:
              h=s.head(url,allow_redirects=True,timeout=15)
              size=int(h.headers.get("content-length") or 0)
             except Exception:size=0
             cand.append({"url":url,"size":size})
            cand.sort(key=lambda x:x["size"],reverse=True)
            print("CANDIDATES",key,json.dumps(cand[:8]),flush=True)
            json.dump(cand,open(f"out/{key}_urls.json","w"),indent=2)
            for c in cand:
             if c["size"]>100000000:continue
             try:
              with s.get(c["url"],timeout=60,stream=True) as response:
               response.raise_for_status()
               path=f"out/{key}.mp4"
               with open(path,"wb") as f:
                for ch in response.iter_content(1<<20):
                 if ch:f.write(ch)
              probe=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration,size","-show_entries","stream=width,height","-of","json",path],capture_output=True,text=True)
              print("VIDEO",key,probe.stdout[:1000],flush=True)
              if probe.returncode==0:break
             except Exception as e:print("FAILED",key,str(e),flush=True)
           except Exception as e:print("PAGE_FAILURE",key,repr(e),flush=True)
          
          PY
          python /tmp/source.py
          for f in out/*.mp4; do
            [ -e "$f" ] || continue
            ffmpeg -y -loglevel error -i "$f" -vf "fps=1/2,scale=340:-2,tile=4x4" -frames:v 1 "${f%.mp4}_CONTACT.jpg" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: SBV_Phobos_V2_Hubble_Authentic_Observational_Timelapses
          path: out/
          retention-days: 7
