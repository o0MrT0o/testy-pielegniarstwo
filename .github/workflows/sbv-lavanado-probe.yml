name: SBV LAVANADO verified 1080 sources QA
on:
  push:
    branches: [sbv-lavanado-real-1080-20261106]
    paths: [.github/workflows/sbv-lavanado-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download actual USGS public domain high-res videos
        run: |
          set -euo pipefail
          mkdir -p assets out
          BASE=https://usgs-ocapsv2-public-input-media.s3.us-west-2.amazonaws.com/assets/palladium/production/s3fs-public/media/video
          for f in 20250117_ground_video.mp4 multimediaFile-4240.mp4 GH010330_1.mp4; do
            echo "SOURCE: $f"
            curl -ILs "$BASE/$f" | grep -Ei '^HTTP|content-length:|content-type:' || true
            curl --fail -L --retry 5 --retry-all-errors --connect-timeout 18 -o "assets/$f" "$BASE/$f"
          done
      - name: Assess actual pixels and metadata
        run: |
          python -m pip install -q Pillow
          python - <<'PY'
          import json,subprocess,os,glob
          from PIL import Image,ImageDraw
          imgs=[];meta={}
          for p in sorted(glob.glob('assets/*')):
            m=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,size,bit_rate:stream=codec_type,codec_name,width,height,r_frame_rate','-of','json',p],text=True))
            meta[os.path.basename(p)]=m
            d=float(m['format']['duration']); print('REAL SOURCE',p,'DURATION',d,'META',m,flush=True)
            vals=[.025,.1,.25,.50,.72,.81,.86,.91,.95,.98] if 'ground' in p else [.04,.14,.27,.40,.53,.66,.79,.92]
            for i,f in enumerate(vals):
              t=f*d;out=f'out/{os.path.basename(p)}_{i:02d}.jpg'
              subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',str(t),'-i',p,'-vframes','1','-vf','scale=360:300:force_original_aspect_ratio=decrease,pad=360:300:(ow-iw)/2:(oh-ih)/2','-q:v','2',out],check=True)
              imgs.append((os.path.basename(p),t,Image.open(out).convert('RGB')))
          col=5;row=(len(imgs)+col-1)//col
          contact=Image.new('RGB',(col*364,row*324),'#131316');dr=ImageDraw.Draw(contact)
          for idx,(n,t,im) in enumerate(imgs):
            x=(idx%col)*364;y=(idx//col)*324;contact.paste(im,(x,y));dr.text((x+4,y+302),f'{n[:19]} @ {t:.1f}s',fill='white')
          contact.save('out/Lavanado_USGS_source_contact.jpg',quality=90)
          open('out/source_ffprobe.json','w').write(json.dumps(meta,indent=2))
          PY
      - name: Export real footage sample images and specs
        uses: actions/upload-artifact@v4
        with:
          name: SBV-USGS-Lavanado-source-QA
          path: |
            out/Lavanado_USGS_source_contact.jpg
            out/source_ffprobe.json
          retention-days: 3
