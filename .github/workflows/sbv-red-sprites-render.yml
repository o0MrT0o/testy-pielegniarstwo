name: SBV Red Sprites Final Render

on:
  push:
    branches: [sbv-render-duobrachium-temp]
    paths:
      - '.github/workflows/sbv-red-sprites-render.yml'
      - 'sbv_render/render_red_sprites.py'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install production dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libsndfile1
          python -m pip install --upgrade pip
          python -m pip install 'numpy<3' soundfile onnxruntime espeakng-loader 'kokoro-onnx==0.6.1'

      - name: Download exact Strange But Verified voice model
        run: |
          mkdir -p build_sprites/models build_sprites/assets
          curl -L --fail --retry 4 -o build_sprites/models/kokoro-v1.0.onnx 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx'
          curl -L --fail --retry 4 -o build_sprites/models/voices-v1.0.bin 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin'
          echo 'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  build_sprites/models/kokoro-v1.0.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  build_sprites/models/voices-v1.0.bin' | sha256sum -c -

      - name: Download authentic NASA/UAF visual sources
        run: |
          curl -L --fail --retry 4 -o build_sprites/assets/sprite_2012.mp4 'https://svs.gsfc.nasa.gov/vis/a010000/a011000/a011059/ISS-540-MASTER_high.mp4'
          curl -L --fail --retry 4 -o build_sprites/assets/iss_storms.mp4 'https://svs.gsfc.nasa.gov/vis/a030000/a030100/a030180/iss028_nighttime_20110819_720p.mp4'
          curl -L --fail --retry 4 -o build_sprites/assets/sprite_2024.jpg 'https://assets.science.nasa.gov/dynamicimage/assets/science/esd/eo/images/imagerecords/153000/153422/iss071e234765_lrg.jpg?crop=faces%2Cfocalpoint&fit=clip&h=5005&w=7508'
          curl -L --fail --retry 4 -o build_sprites/assets/sprite_1989.jpg 'https://svs.gsfc.nasa.gov/vis/a010000/a011000/a011059/redSprite_1024x576.jpg'
          curl -L --fail --retry 4 -o build_sprites/assets/sprite_triptych.jpg 'https://svs.gsfc.nasa.gov/vis/a010000/a011000/a011059/sprite_triptych_1920x1080.jpg'
          curl -L --fail --retry 4 -o build_sprites/assets/sprite_2012_still.jpg 'https://svs.gsfc.nasa.gov/vis/a010000/a011000/a011059/ISS031-E-10712_still01_1920x1080.jpg'
          curl -L --fail --retry 4 -o build_sprites/assets/thunder.ogg 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Thunderstorm%20after%20hot%20summer%20day%2017%20minutes%2003%20of%2004.ogg'
          for f in build_sprites/assets/sprite_2012.mp4 build_sprites/assets/iss_storms.mp4 build_sprites/assets/sprite_2024.jpg build_sprites/assets/sprite_1989.jpg build_sprites/assets/sprite_triptych.jpg build_sprites/assets/sprite_2012_still.jpg build_sprites/assets/thunder.ogg; do test -s "$f"; done
          file build_sprites/assets/sprite_2024.jpg build_sprites/assets/sprite_1989.jpg build_sprites/assets/sprite_triptych.jpg build_sprites/assets/thunder.ogg
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 build_sprites/assets/sprite_2012.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 build_sprites/assets/iss_storms.mp4

      - name: Build source audit sheets
        run: |
          ffmpeg -y -hide_banner -loglevel error -i build_sprites/assets/sprite_2012.mp4 -vf 'fps=1/1,scale=320:-2,tile=4x3:padding=4:margin=4' -frames:v 1 build_sprites/source_sprite2012.jpg
          ffmpeg -y -hide_banner -loglevel error -i build_sprites/assets/iss_storms.mp4 -vf 'fps=1/8,scale=320:-2,tile=4x4:padding=4:margin=4' -frames:v 1 build_sprites/source_issstorms.jpg
          cp build_sprites/assets/sprite_2024.jpg build_sprites/source_sprite2024.jpg
          cp build_sprites/assets/sprite_1989.jpg build_sprites/source_sprite1989.jpg

      - name: Apply final editorial corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sbv_render/render_red_sprites.py')
          s=p.read_text()

          old='''TEXTS=[
          "This red flash isn't below a thunderstorm. It's above it — almost in space.",
          "For decades, pilots reported giant crimson flashes over storms, but scientists had almost no proof.",
          "Then, in 1989, a camera caught one by accident.",
          "They're called red sprites: electrical discharges triggered by powerful lightning far below.",
          "They usually form around fifty to eighty-five kilometers above Earth, and some stretch tens of kilometers tall.",
          "Yet many last only milliseconds.",
          "Astronauts on the International Space Station have caught them on camera.",
          "Watch the storm below.",
          "There. A structure tens of kilometers tall — gone almost instantly."
          ]'''.replace('          ','')
          new='''TEXTS=[
          "This red flash isn't below the storm. It's above it — almost in space.",
          "Pilots reported crimson bursts like this for decades, but scientists had almost no proof.",
          "Then, in 1989, a camera caught one by accident.",
          "They're red sprites: electrical discharges triggered by powerful lightning below.",
          "They form around fifty to eighty-five kilometers up, and can stretch tens of kilometers tall.",
          "Yet many last only milliseconds.",
          "Astronauts on the ISS have caught them on camera.",
          "Watch the storm below.",
          "There. Gone almost instantly."
          ]'''.replace('          ','')
          if old not in s: raise SystemExit('Narration block not found')
          s=s.replace(old,new,1)

          s=s.replace("add(x[1],x[2],'video','iss_storms.mp4',57.0,'wide'", "add(x[1],x[2],'video','iss_storms.mp4',32.0,'wide'",1)
          s=s.replace("add(x[0],x[1],'video','iss_storms.mp4',70.0,'normal'", "add(x[0],x[1],'video','iss_storms.mp4',47.0,'normal'",1)
          s=s.replace("if TOTAL>46:", "if TOTAL>45:",1)
          s=s.replace('d=.30','d=0.30').replace('d=.35','d=0.35')

          old="add(bounds[7],TOTAL,'video','sprite_2012.mp4',4.55,'wide','NASA EARTH OBSERVATORY  |  ISS 2012 FOOTAGE')"
          new="add(bounds[7],parts[8]['start'],'video','sprite_2012.mp4',3.30,'hero','NASA EARTH OBSERVATORY  |  ISS 2012 FOOTAGE')\nadd(parts[8]['start'],TOTAL,'video','sprite_2012.mp4',5.45,'hero','NASA EARTH OBSERVATORY  |  ISS 2012 FOOTAGE  |  REPLAY')"
          if old not in s: raise SystemExit('Hero shot pattern not found')
          s=s.replace(old,new,1)

          old="    if mode=='wide': fg='[fg0]scale=1010:-2:flags=lanczos[fg];'\n    elif mode=='tight': fg=\"[fg0]scale=1220:-2:flags=lanczos,crop=1080:ih:x='(iw-1080)/2':y=0[fg];\"\n    else: fg='[fg0]scale=1080:-2:flags=lanczos[fg];'"
          new="    if mode=='wide': fg='[fg0]scale=1010:-2:flags=lanczos[fg];'\n    elif mode=='tight': fg=\"[fg0]scale=1220:-2:flags=lanczos,crop=1080:ih:x='(iw-1080)/2':y=0[fg];\"\n    elif mode=='hero': fg=\"[fg0]scale=1580:-2:flags=lanczos,crop=1080:ih:x='iw-1080':y=0[fg];\"\n    else: fg='[fg0]scale=1080:-2:flags=lanczos[fg];'"
          if old not in s: raise SystemExit('Framing pattern not found')
          s=s.replace(old,new,1)

          s=s.replace("f'THIS FLASH ISN\\'T BELOW THE STORM\\\\N{{\\\\c{yellow}}}IT\\'S ABOVE IT{{\\\\c{white}}}'", "f'NOT BELOW THE STORM\\\\N{{\\\\c{yellow}}}ABOVE IT — ALMOST IN SPACE{{\\\\c{white}}}'",1)
          s=s.replace("f'RED SPRITES\\\\N{{\\\\c{yellow}}}TRIGGERED BY POWERFUL LIGHTNING{{\\\\c{white}}}'", "f'RED SPRITES\\\\N{{\\\\c{yellow}}}TRIGGERED BY LIGHTNING{{\\\\c{white}}}'",1)
          s=s.replace("'ASTRONAUTS HAVE FILMED THEM\\\\NFROM THE ISS'", "'FILMED FROM THE ISS'",1)
          s=s.replace('Style: Caption,DejaVu Sans,58,','Style: Caption,DejaVu Sans,54,',1)

          marker="    f.write(f'Dialogue: 3,{astamp(bounds[5]+.16)},{astamp(bounds[6])},Card,,0,0,0,,DURATION  ·  MILLISECONDS\\n')"
          add_replay=marker+"\n    f.write(f'Dialogue: 5,{astamp(parts[8][\"start\"]+.04)},{astamp(min(TOTAL,parts[8][\"start\"]+1.30))},Tag,,0,0,0,,REPLAY\\n')"
          if marker not in s: raise SystemExit('Replay marker insertion point not found')
          s=s.replace(marker,add_replay,1)

          s=s.replace('There Is Lightning Above Thunderstorms','This Red Flash Appears Above Thunderstorms',1)
          s=s.replace('| Hero moment | Continuous authentic ISS footage; narrator says “Watch the storm below,” then stops | NASA EO 2012 | ~2.3 s breathing moment + quiet public-domain thunder ambience |','| Hero moment | Authentic ISS footage reframed toward the sprite; narrator says “Watch the storm below,” then stops; exact event is shown again once as a labeled replay | NASA EO 2012 | ~2.2 s breathing moment + quiet public-domain thunder ambience |',1)

          p.write_text(s)
          PY

      - name: Render final Short and QA
        env:
          ORT_DISABLE_TELEMETRY: '1'
        run: python sbv_render/render_red_sprites.py

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: SBV21-Red-Sprites-FINAL
          path: |
            build_sprites/Strange_But_Verified_21_Red_Sprites_FINAL.mp4
            build_sprites/Strange_But_Verified_21_Red_Sprites_EN.srt
            build_sprites/QA.md
            build_sprites/shot_list.md
            build_sprites/sources.md
            build_sprites/metadata.md
            build_sprites/contact.jpg
            build_sprites/first3.jpg
            build_sprites/hero.jpg
            build_sprites/source_sprite2012.jpg
            build_sprites/source_issstorms.jpg
            build_sprites/source_sprite2024.jpg
            build_sprites/source_sprite1989.jpg
            build_sprites/captions.ass
            build_sprites/voice/timing.json
            build_sprites/voice/narration.txt
            build_sprites/decode.txt
            build_sprites/loudness.txt
            build_sprites/thunder_breath.wav
            build_sprites/ffprobe.json
          retention-days: 5
          if-no-files-found: error
