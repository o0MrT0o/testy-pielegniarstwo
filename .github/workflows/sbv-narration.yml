name: SBV Original Channel Narration
on:
  push:
    branches:
      - sbv-seacucumber-noaa-2026
    paths:
      - '.github/workflows/sbv-narration.yml'
jobs:
  render-sbv-channel-narration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Install speech tools
        run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng ffmpeg libsndfile1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU speech synthesis models
        run: |
          python -m pip install -U pip
          pip install 'torch==2.6.0+cpu' 'torchaudio==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          pip install 'chatterbox-tts==0.1.6' 'kokoro==0.9.4' soundfile
      - name: Reproduce original synthetic SBV voice pipeline Kokoro to Chatterbox Turbo
        run: |
          cat > /tmp/sbv_voice.py <<'PY'
          import os, numpy as np, torch, soundfile as sf, torchaudio as ta
          from kokoro import KPipeline
          from chatterbox.tts_turbo import ChatterboxTurboTTS
          os.makedirs("out", exist_ok=True)
          torch.set_num_threads(2)
          torch.manual_seed(48217)
          p=KPipeline(lang_code="b")
          mix=p.load_voice("bf_emma")*0.72 + p.load_voice("af_bella")*0.18 + p.load_voice("am_michael")*0.10
          sample="Somewhere in the deep sea, scientists found something that looks impossible. But this is not an illusion. This was captured on camera."
          parts=[]
          for result in p(sample, voice=mix, speed=0.82):
              if result.audio is not None:
                  parts.append(result.audio.detach().cpu().numpy())
          assert parts,"Kokoro did not generate the reference"
          sf.write("out/SBV_kokoro_original_mix_reference.wav",np.concatenate(parts),24000)
          print("REFERENCE_READY",sf.info("out/SBV_kokoro_original_mix_reference.wav"),flush=True)
          del p
          import gc
          gc.collect()
          # Chatterbox hardcodes token=True although model is public MIT; force anonymous public download
          import chatterbox.tts_turbo as cb_turbo
          from huggingface_hub import snapshot_download as hf_snapshot_download
          cb_turbo.snapshot_download=lambda *args,**kwargs: hf_snapshot_download(*args,**{**kwargs,"token":False})
          model=ChatterboxTurboTTS.from_pretrained(device="cpu")
          torch.manual_seed(48217)
          script="This isn't a jellyfish. It's a sea cucumber, and it swims. NOAA filmed this animal more than two kilometres beneath the Pacific. Most sea cucumbers crawl along the seafloor. But some can leave it entirely, flexing their bodies to rise through open water. They drift, then descend to feed. And every second you're seeing is real."
          wav=model.generate(script,audio_prompt_path="out/SBV_kokoro_original_mix_reference.wav",temperature=0.66,top_p=0.88,repetition_penalty=1.12)
          ta.save("out/SBV_SeaCucumber_narration_original_channel_style.wav",wav.cpu(),model.sr)
          print("NARRATION_READY",sf.info("out/SBV_SeaCucumber_narration_original_channel_style.wav"),flush=True)
          
          PY
          python /tmp/sbv_voice.py
      - name: Preserve original-profile narration WAV and sample
        uses: actions/upload-artifact@v4
        with:
          name: SBV_SeaCucumber_Original_Style_Narration
          path: out/*.wav
          retention-days: 7
