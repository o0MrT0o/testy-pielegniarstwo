name: SBV spider asset bridge

on:
  push:
    branches: [ main ]

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Fetch authentic Morley-Robert videos
        run: |
          set -euo pipefail
          mkdir -p sbv_spider
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          out=Path('sbv_spider')
          ua={'User-Agent':'Mozilla/5.0 SBV asset fetcher'}
          src={
            'source_mmc2.mp4':['https://ars.els-cdn.com/content/image/1-s2.0-S0960982218306936-mmc2.mp4','https://gwern.net/doc/science/2018-morley-video-electricalspiderballooning-1-s2.0-S0960982218306936-mmc2.mp4'],
            'source_mmc4.mp4':['https://ars.els-cdn.com/content/image/1-s2.0-S0960982218306936-mmc4.mp4','https://gwern.net/doc/science/2018-morley-videoabstract-electricalspiderballoon-1-s2.0-S0960982218306936-mmc4.mp4']}
          man=[]
          for name,urls in src.items():
            ok=False; errs=[]
            for u in urls:
              try:
                req=urllib.request.Request(u,headers=ua)
                with urllib.request.urlopen(req,timeout=120) as r:
                  b=r.read(); final=r.geturl(); ct=r.headers.get_content_type()
                if len(b)<100000: raise RuntimeError(f'too small {len(b)}')
                (out/name).write_bytes(b)
                man.append({'file':name,'resolved_url':final,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'content_type':ct})
                print(name,len(b),final); ok=True; break
              except Exception as e: errs.append(f'{u}: {e}')
            if not ok: raise SystemExit(name+' failed\n'+'\n'.join(errs))
          (out/'source_manifest.json').write_text(json.dumps(man,indent=2),encoding='utf-8')
          PY
          ffprobe -v error -show_entries format=duration:stream=index,codec_name,width,height,r_frame_rate -of json sbv_spider/source_mmc2.mp4 > sbv_spider/mmc2_probe.json
          ffprobe -v error -show_entries format=duration:stream=index,codec_name,width,height,r_frame_rate -of json sbv_spider/source_mmc4.mp4 > sbv_spider/mmc4_probe.json
          ffmpeg -y -v error -i sbv_spider/source_mmc2.mp4 -vf "fps=1/2,scale=360:-2,tile=5x4:padding=6:margin=6" -frames:v 1 sbv_spider/contact_mmc2.jpg
          ffmpeg -y -v error -i sbv_spider/source_mmc4.mp4 -vf "fps=1/8,scale=270:-2,tile=5x4:padding=5:margin=5" -frames:v 1 sbv_spider/contact_mmc4.jpg

      - name: Generate approved native af_heart narration
        run: |
          set -euo pipefail
          python -m pip install -q 'kokoro-onnx==0.6.1' 'onnxruntime>=1.20,<2' soundfile numpy
          curl -L --fail --retry 3 -o sbv_spider/kokoro-v1.0.onnx 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx'
          curl -L --fail --retry 3 -o sbv_spider/voices-v1.0.bin 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin'
          echo '7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  sbv_spider/kokoro-v1.0.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  sbv_spider/voices-v1.0.bin' | sha256sum -c -
          python - <<'PY'
          import os,json,hashlib,dataclasses
          from pathlib import Path
          os.environ['ORT_DISABLE_TELEMETRY']='1'
          import onnxruntime as ort; ort.disable_telemetry_events()
          import soundfile as sf
          from kokoro_onnx import Kokoro
          p=Path('sbv_spider')
          text="This spider lifted off with no wind. Researchers switched on an electric field like those found naturally in the atmosphere. The spider tiptoed, released silk, and rose. Turn the field off, and it dropped. Wind still matters outdoors. Electricity isn't the whole story. But atmospheric-strength electric fields can trigger ballooning and provide lift. Strange, but verified."
          opts=ort.SessionOptions(); opts.intra_op_num_threads=4; opts.inter_op_num_threads=1
          sess=ort.InferenceSession(str(p/'kokoro-v1.0.onnx'),sess_options=opts,providers=['CPUExecutionProvider'])
          k=Kokoro.from_session(sess,str(p/'voices-v1.0.bin'))
          ph=k.tokenizer.phonemize(text,lang='en-us')
          audio,sr,times=k.create_timed(ph,voice='af_heart',speed=0.88,lang='en-us',is_phonemes=True,trim=False,continuous=True)
          sf.write(p/'narration_af_heart.wav',audio,sr,subtype='PCM_24')
          (p/'phoneme_times.json').write_text(json.dumps([dataclasses.asdict(x) for x in times],indent=2),encoding='utf-8')
          meta={'engine':'Kokoro-82M v1.0','implementation':'kokoro-onnx==0.6.1','voice':'af_heart','lang':'en-us','speed':0.88,'continuous':True,'trim':False,'duration':len(audio)/sr,'sample_rate':sr,'wav_sha256':hashlib.sha256((p/'narration_af_heart.wav').read_bytes()).hexdigest(),'model_sha256':hashlib.sha256((p/'kokoro-v1.0.onnx').read_bytes()).hexdigest(),'voices_sha256':hashlib.sha256((p/'voices-v1.0.bin').read_bytes()).hexdigest(),'post_synthesis_pitch_or_tempo_change':False}
          (p/'voice_metadata.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          (p/'narration.txt').write_text(text,encoding='utf-8')
          print(json.dumps(meta,indent=2))
          PY
          rm sbv_spider/kokoro-v1.0.onnx sbv_spider/voices-v1.0.bin

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: sbv-spider-assets
          path: sbv_spider/
          retention-days: 1
          if-no-files-found: error
