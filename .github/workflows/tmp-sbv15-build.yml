name: TEMP SBV15 Grand Prismatic Build
on:
  push:
    branches: [tmp-sbv15-render-20261004]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core zip
          python -m pip install --upgrade pip
          pip install numpy==2.2.6 soundfile==0.14.0 kokoro-onnx==0.6.1 onnxruntime==1.22.1 espeakng-loader==0.2.4 Pillow==12.3.0 requests
      - name: Download authentic source footage and locked voice model
        run: |
          mkdir -p assets15 voice15
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import requests, time, hashlib

          # Download the NPS boardwalk clip first; it was the file hit by Wikimedia's
          # rate-limit in the previous run. Then pace all further Wikimedia transfers.
          commons=[
            ('assets15/gps_boardwalk.webm','Grand Prismatic Spring boardwalk timelapse (36948603771).webm'),
            ('assets15/gps_v1.webm','Grand Prismatic Spring (Midway Geyser Basin, Yellowstone National Park) 2021-08-10, video1.webm'),
            ('assets15/gps_v2.webm','Grand Prismatic Spring (Midway Geyser Basin, Yellowstone National Park) 2021-08-10, video2.webm'),
            ('assets15/gps_v3.webm','Grand Prismatic Spring (Midway Geyser Basin, Yellowstone National Park) 2021-08-10, video3.webm'),
            ('assets15/gps_v4.webm','Grand Prismatic Spring (Midway Geyser Basin, Yellowstone National Park) 2021-08-10, video4.webm'),
            ('assets15/gps_timelapse.webm','Grand Prismatic Spring (timelapse).webm'),
            ('assets15/gps_overlook.webm','Grand Prismatic Spring Overlook timelapse (36254802534).webm'),
          ]
          s=requests.Session()
          s.headers.update({'User-Agent':'StrangeButVerified/1.0 educational documentary production; contact via repository owner'})
          backoffs=[0,45,90,180,240]
          for idx,(dst,name) in enumerate(commons):
              p=Path(dst); p.parent.mkdir(parents=True,exist_ok=True)
              url='https://commons.wikimedia.org/wiki/Special:Redirect/file/'+quote(name,safe='')
              ok=False
              for attempt,wait in enumerate(backoffs):
                  if wait:
                      print(f'BACKOFF {wait}s before retry {attempt} for {name}',flush=True)
                      time.sleep(wait)
                  try:
                      print('DOWNLOAD',dst,flush=True)
                      with s.get(url,stream=True,timeout=360,allow_redirects=True) as r:
                          if r.status_code==429:
                              print('WIKIMEDIA 429',name,flush=True)
                              continue
                          r.raise_for_status()
                          with open(p,'wb') as f:
                              for chunk in r.iter_content(1024*1024):
                                  if chunk: f.write(chunk)
                      if p.exists() and p.stat().st_size>100000:
                          ok=True; break
                  except Exception as e:
                      print('DOWNLOAD ERROR',type(e).__name__,str(e)[:300],flush=True)
              if not ok:
                  raise RuntimeError(f'Could not download {name}')
              print('DONE',dst,p.stat().st_size,flush=True)
              if idx < len(commons)-1:
                  time.sleep(12)

          # Locked channel voice model — official kokoro-onnx release.
          models={
            'voice15/kokoro-v1.0.onnx':'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx',
            'voice15/voices-v1.0.bin':'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin',
          }
          for dst,url in models.items():
              p=Path(dst)
              for attempt in range(5):
                  try:
                      print('DOWNLOAD MODEL',dst,flush=True)
                      with s.get(url,stream=True,timeout=600,allow_redirects=True) as r:
                          r.raise_for_status()
                          with open(p,'wb') as f:
                              for chunk in r.iter_content(1024*1024):
                                  if chunk: f.write(chunk)
                      break
                  except Exception:
                      if attempt==4: raise
                      time.sleep(10*(attempt+1))

          expected={
            'voice15/kokoro-v1.0.onnx':('beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a',325505369),
            'voice15/voices-v1.0.bin':('bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d',28214398),
          }
          for fn,(want_sha,want_size) in expected.items():
              p=Path(fn)
              assert p.stat().st_size==want_size,(fn,p.stat().st_size,want_size)
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              assert got==want_sha,(fn,got,want_sha)
          PY
          for f in assets15/*.webm; do ffprobe -v error "$f" >/dev/null; done
      - name: Render production master
        env:
          ORT_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python render_sbv15_grand_prismatic.py
      - name: Build visual contact sheet
        run: |
          mkdir -p review15
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from PIL import Image,ImageOps,ImageDraw
          v=Path('out15/Strange_But_Verified_15_Grand_Prismatic_PRODUCTION_MASTER.mp4')
          dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(v)],text=True).strip())
          times=[dur*i/19 for i in range(20)]
          ims=[]
          for i,t in enumerate(times):
              p=Path('review15')/f'frame_{i:02}.jpg'
              subprocess.run(['ffmpeg','-y','-hide_banner','-loglevel','error','-ss',f'{min(t,dur-0.05):.3f}','-i',str(v),'-frames:v','1',str(p)],check=True)
              im=Image.open(p).convert('RGB'); im=ImageOps.fit(im,(270,480),method=Image.Resampling.LANCZOS)
              d=ImageDraw.Draw(im); d.rectangle((0,0,95,24),fill=(0,0,0)); d.text((5,5),f'{t:.1f}s',fill='white'); ims.append(im)
          sheet=Image.new('RGB',(1350,1920),(0,0,0))
          for i,im in enumerate(ims): sheet.paste(im,((i%5)*270,(i//5)*480))
          sheet.save('review15/contact_final.jpg',quality=94)
          PY
          cp review15/contact_final.jpg out15/Strange_But_Verified_15_Contact_Sheet.jpg
      - name: Package verified delivery
        run: |
          cp render_sbv15_grand_prismatic.py out15/
          cp captions15.ass out15/
          cp voice15/timing.json out15/Strange_But_Verified_15_Timing.json
          cd out15
          zip -9 ../Strange_But_Verified_15_Grand_Prismatic_PRODUCTION_MASTER_VERIFIED.zip ./*
      - uses: actions/upload-artifact@v4
        with:
          name: Strange_But_Verified_15_Grand_Prismatic_FINAL
          path: |
            out15/
            Strange_But_Verified_15_Grand_Prismatic_PRODUCTION_MASTER_VERIFIED.zip
          retention-days: 7
          compression-level: 0
