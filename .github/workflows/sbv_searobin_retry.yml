name: SBV Searobin Final Retry

on:
  push:
    paths:
      - '.github/workflows/sbv_searobin_retry.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install 'kokoro-onnx==0.6.1' 'onnxruntime>=1.17,<2' 'soundfile>=0.13' 'numpy>=1.26,<3' 'Pillow>=10'

      - name: Download source models and renderer
        run: |
          set -euxo pipefail
          mkdir -p work/assets work/models work/out work/qa
          curl -L --fail --retry 4 --retry-all-errors -o work/assets/searobin.mp4 'https://oceanexplorer.noaa.gov/wp-content/uploads/2018/05/searobin_1280x720.mp4'
          curl -L --fail --retry 4 --retry-all-errors -o work/models/kokoro-v1.0.onnx 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx'
          curl -L --fail --retry 4 --retry-all-errors -o work/models/voices-v1.0.bin 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin'
          curl -L --fail --retry 4 --retry-all-errors -o work/base.yml 'https://raw.githubusercontent.com/o0MrT0o/testy-pielegniarstwo/main/.github/workflows/sbv_searobin_source_audit.yml'
          echo 'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  work/models/kokoro-v1.0.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  work/models/voices-v1.0.bin' | sha256sum -c -

      - name: Patch pacing source ranges and render
        run: |
          python - <<'PATCHPY'
          from pathlib import Path
          txt=Path('work/base.yml').read_text(encoding='utf-8')
          marker="cat > work/render.py <<'PY'\n"
          block=txt.split(marker,1)[1].split("\n          PY",1)[0]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())+'\n'
          old_base='BASE=[2.25,2.45,2.70,2.65,2.75,3.25,2.40,2.75,2.80]'
          new_base='BASE=[2.20,2.00,2.40,2.30,2.40,3.00,2.00,2.30,2.40]'
          old_starts='STARTS=[18.0,20.2,39.0,18.7,12.0,24.0,39.0,18.0,21.0,18.4]'
          new_starts='STARTS=[18.0,20.2,18.5,21.0,16.0,18.8,22.0,18.2,20.0,18.4]'
          assert old_base in code and old_starts in code
          code=code.replace(old_base,new_base,1).replace(old_starts,new_starts,1)
          Path('work/render.py').write_text(code,encoding='utf-8')
          PATCHPY
          python work/render.py

      - name: Upload final and QA
        uses: actions/upload-artifact@v4
        with:
          name: SBV-Armored-Searobin-FINAL-CLEAN
          path: |
            work/out/Strange_But_Verified_Armored_Searobin_FINAL.mp4
            work/qa/
          retention-days: 1
          compression-level: 0
