name: SBV Fire Voice V3

on:
  push:
    paths:
      - '.github/workflows/sbv_fire_voice_v3.yml'
  workflow_dispatch:

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'kokoro-onnx==0.6.1' soundfile
      - run: |
          curl -L --fail --retry 3 -o kokoro-v1.0.onnx 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx'
          curl -L --fail --retry 3 -o voices-v1.0.bin 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin'
      - run: |
          mkdir -p out
          cat > make_voice.py <<'PY'
          import soundfile as sf
          from kokoro_onnx import Kokoro
          text = "This is a real flame. So why does it look like a glowing ball? In microgravity, hot gas doesn't rise normally. On Earth, rising hot gas stretches flames into a teardrop. Without that upward flow, oxygen reaches the fuel from all directions, so the flame wraps into a sphere. NASA filmed this in FLEX experiments aboard the International Space Station. Understanding that behavior helps engineers make spacecraft safer. Same fire. Different gravity. Completely different shape."
          kokoro = Kokoro('kokoro-v1.0.onnx','voices-v1.0.bin')
          audio, sr = kokoro.create(text, voice='af_heart', speed=0.88, lang='en-us', continuous=True)
          sf.write('out/narration_v3.wav', audio, sr, subtype='PCM_16')
          open('out/script_v3.txt','w').write(text+'\n')
          PY
          python make_voice.py
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/narration_v3.wav > out/duration.txt
          sha256sum out/narration_v3.wav > out/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sbv-fire-voice-v3
          path: out/
          retention-days: 1
