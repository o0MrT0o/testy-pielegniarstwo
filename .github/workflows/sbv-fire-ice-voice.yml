name: SBV Fire Ice Natural History Voice

on:
  push:
    paths:
      - '.github/workflows/sbv-fire-ice-voice.yml'

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
      - name: Kokoro reference env
        run: |
          python -m venv .venv-kokoro
          .venv-kokoro/bin/python -m pip install --upgrade pip
          .venv-kokoro/bin/python -m pip install 'kokoro-onnx==0.6.1' soundfile
          curl -L --fail -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -L --fail -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          cat > make_ref.py <<'PY'
          import soundfile as sf
          from kokoro_onnx import Kokoro
          text="Across the frozen river, a vast circle of ice turns almost silently. No machine carved it. No one set it in motion. The river itself did that."
          k=Kokoro('kokoro-v1.0.onnx','voices-v1.0.bin')
          audio,sr=k.create(text,voice='bf_isabella',speed=0.84,lang='en-gb')
          sf.write('REF_UK_ISABELLA.wav',audio,sr,subtype='PCM_16')
          PY
          .venv-kokoro/bin/python make_ref.py
      - name: Chatterbox env
        run: |
          python -m venv .venv-chatter
          .venv-chatter/bin/python -m pip install --upgrade pip setuptools wheel
          .venv-chatter/bin/python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          .venv-chatter/bin/python -m pip install chatterbox-tts==0.1.6 soundfile numpy
          .venv-chatter/bin/python -m pip uninstall -y resemble-perth
          .venv-chatter/bin/python -m pip install --no-deps 'git+https://github.com/resemble-ai/Perth.git@master'
      - name: Generate and assemble Natural History narration
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
        run: |
          cat > synth.py <<'PY'
          import random, json, numpy as np, torch, torchaudio as ta
          import chatterbox.tts_turbo as turbo
          from huggingface_hub import snapshot_download as hf_snapshot_download

          sentences=[
            "This looks like ice on fire.",
            "But nothing has been poured onto it.",
            "It's methane hydrate — an ice-like crystal that can form in cold, high-pressure sediments beneath the sea.",
            "Water molecules build cages around methane.",
            "Move that hydrate into warmer, lower-pressure conditions, and the structure begins to break apart.",
            "The methane escapes.",
            "And methane burns.",
            "In the deep ocean, this same material can sit beneath the seafloor beside active gas seeps.",
            "So the flame is real. The ice-like solid is real.",
            "Strange, but verified."
          ]
          pauses=[0.34,0.38,0.36,0.32,0.38,0.28,0.36,0.38,0.42]

          def public_snapshot_download(*args,**kwargs):
              kwargs.pop('token',None)
              return hf_snapshot_download(*args,token=False,**kwargs)
          turbo.snapshot_download=public_snapshot_download
          model=turbo.ChatterboxTurboTTS.from_pretrained(device='cpu')
          settings=dict(temperature=0.55,min_p=0.0,top_p=0.85,top_k=700,repetition_penalty=1.15,norm_loudness=True)

          parts=[]; timings=[]; t=0.0
          for i,text in enumerate(sentences):
              # Same seed profile as the accepted E voice for consistent delivery.
              random.seed(7); np.random.seed(7); torch.manual_seed(7)
              wav=model.generate(text,audio_prompt_path='REF_UK_ISABELLA.wav',**settings).detach().cpu()
              if wav.ndim==1: wav=wav.unsqueeze(0)
              # Trim only outer digital/near-silence. Never remove internal pauses.
              mono=wav.abs().max(dim=0).values
              peak=float(mono.max())
              threshold=max(peak*0.00316, 1e-5)  # roughly -50 dB relative to peak
              idx=torch.nonzero(mono>threshold).flatten()
              if idx.numel():
                  pad=int(0.07*model.sr)
                  a=max(0,int(idx[0])-pad); b=min(wav.shape[-1],int(idx[-1])+pad+1)
                  wav=wav[:,a:b]
              dur=wav.shape[-1]/model.sr
              timings.append({'index':i,'text':text,'start':t,'end':t+dur,'duration':dur})
              parts.append(wav); t+=dur
              if i<len(sentences)-1:
                  p=torch.zeros((wav.shape[0],int(pauses[i]*model.sr)),dtype=wav.dtype)
                  parts.append(p); t+=pauses[i]
          assembled=torch.cat(parts,dim=-1)
          ta.save('assembled_raw.wav',assembled,model.sr)
          json.dump(timings,open('timings.json','w'),indent=2)

          def ts(v):
              h=int(v//3600); v-=h*3600; m=int(v//60); v-=m*60; s=int(v); ms=int(round((v-s)*1000))
              if ms==1000: s+=1; ms=0
              return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'
          with open('SBV_Fire_Ice_English.srt','w') as f:
              for j,x in enumerate(timings,1):
                  f.write(f"{j}\n{ts(x['start'])} --> {ts(x['end'])}\n{x['text']}\n\n")
          print('TOTAL_SECONDS', assembled.shape[-1]/model.sr)
          print(json.dumps(timings,indent=2))
          PY
          .venv-chatter/bin/python synth.py
      - name: Master and validate narration
        run: |
          ffmpeg -y -v error -i assembled_raw.wav -af loudnorm=I=-16:TP=-2:LRA=5 -ar 48000 -ac 1 SBV_Fire_Ice_Natural_History_FINAL.wav
          ffmpeg -y -v error -i SBV_Fire_Ice_Natural_History_FINAL.wav -codec:a libmp3lame -b:a 192k SBV_Fire_Ice_Natural_History_FINAL.mp3
          ffmpeg -v error -i SBV_Fire_Ice_Natural_History_FINAL.wav -f null -
          ffprobe -v error -show_entries format=duration,size -show_entries stream=sample_rate,channels -of json SBV_Fire_Ice_Natural_History_FINAL.wav > voice_probe.json
          ffmpeg -hide_banner -i SBV_Fire_Ice_Natural_History_FINAL.wav -af ebur128=peak=true -f null - 2> voice_ebur128.txt
          python - <<'PY'
          import json
          d=json.load(open('voice_probe.json'))
          dur=float(d['format']['duration'])
          assert 25.0 <= dur <= 70.0, f'Implausible narration duration: {dur}s'
          print('Narration duration sanity PASS:',dur)
          PY
      - name: Upload voice
        uses: actions/upload-artifact@v4
        with:
          name: SBV-Fire-Ice-Natural-History-Voice-v2
          path: |
            SBV_Fire_Ice_Natural_History_FINAL.wav
            SBV_Fire_Ice_Natural_History_FINAL.mp3
            SBV_Fire_Ice_English.srt
            timings.json
            voice_probe.json
            voice_ebur128.txt
          retention-days: 7
