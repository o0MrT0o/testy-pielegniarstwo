name: SBV IO exact voice af-heart
on:
  push:
    branches: [sbv-space-04-io-20261021]
    paths: ['.github/workflows/sbv-io-voice.yml']
permissions: {contents: read}
jobs:
  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Voice dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y espeak-ng libsndfile1
          pip install kokoro-onnx==0.6.1 soundfile faster-whisper
      - name: Approved Kokoro model and voice file
        run: |
          curl -LfSs --retry 4 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx' -o kokoro-v1.0.onnx
          curl -LfSs --retry 4 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' -o voices-v1.0.bin
      - name: Generate exact standard female narrator with word timings
        run: |
          cat >/tmp/sbv_voice.py <<'PY'
          import os,hashlib,json,soundfile as sf
          from kokoro_onnx import Kokoro
          script="That's not a cloud. It's a volcano erupting on Io, a moon of Jupiter. NASA caught it in five real spacecraft images. The plume rose three hundred and thirty kilometres above the surface. Jupiter's gravity flexes Io, heating its interior. And this isn't a one-time event. Years later, Juno recorded new volcanic hot spots in infrared. The most volcanically active world in our solar system isn't even a planet."
          expected={"kokoro-v1.0.onnx":"beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a","voices-v1.0.bin":"bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d"}
          for fn,sha in expected.items():
           actual=hashlib.file_digest(open(fn,"rb"),"sha256").hexdigest();assert actual==sha,(fn,actual)
          model=Kokoro("kokoro-v1.0.onnx","voices-v1.0.bin")
          wav,sr=model.create(script,voice="af_heart",speed=0.88,lang="en-us")
          os.makedirs("out",exist_ok=True)
          sf.write("out/SBV_SPACE04_IO_af_heart.wav",wav,sr,subtype="PCM_24")
          open("out/narration.txt","w").write(script)
          print("NARRATION_DURATION",len(wav)/sr,flush=True)
          try:
           import av
           original=av.open
           def patched(*args,**kwargs):
            kwargs.pop("metadata_errors",None);return original(*args,**kwargs)
           av.open=patched
           from faster_whisper import WhisperModel
           m=WhisperModel("tiny.en",device="cpu",compute_type="int8",cpu_threads=2)
           segments,_=m.transcribe("out/SBV_SPACE04_IO_af_heart.wav",language="en",word_timestamps=True,beam_size=3,vad_filter=False)
           words=[{"word":w.word,"start":round(w.start,3),"end":round(w.end,3)} for seg in segments for w in (seg.words or [])]
           json.dump(words,open("out/word_timings.json","w"),indent=2)
           print("TRANSCRIPT"," ".join(w["word"] for w in words),flush=True)
          except Exception as e:print("TRANSCRIPT_WARNING",repr(e),flush=True)
          
          PY
          python /tmp/sbv_voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: SBV_SPACE04_IO_Standard_af_heart_Voice
          path: out/
          retention-days: 7
