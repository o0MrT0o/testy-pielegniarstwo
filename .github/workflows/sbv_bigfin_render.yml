name: SBV Bigfin Squid Final Render

on:
  push:
    branches:
      - sbv-bigfin-render-20261015
    paths:
      - '.github/workflows/sbv_bigfin_render.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install renderer and TTS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install 'kokoro-onnx==0.6.1' 'onnxruntime>=1.17,<2' 'soundfile>=0.13' 'numpy>=1.26,<3' 'requests>=2.31' 'Pillow>=10'

      - name: Download and verify authentic source + approved Kokoro
        run: |
          set -euxo pipefail
          mkdir -p work/assets work/models work/out work/qa
          curl -L --fail --retry 4 --retry-all-errors -o work/assets/noaa_bigfin.mp4 'https://oceanexplorer.noaa.gov/wp-content/uploads/2021/11/dive10-bigfin-squid-1280x720-2.mp4'
          curl -L --fail --retry 4 --retry-all-errors -o work/models/kokoro-v1.0.onnx 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx'
          curl -L --fail --retry 4 --retry-all-errors -o work/models/voices-v1.0.bin 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin'
          echo 'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  work/models/kokoro-v1.0.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  work/models/voices-v1.0.bin' | sha256sum -c -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 work/assets/noaa_bigfin.mp4)" -ge 1200
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/assets/noaa_bigfin.mp4)
          python - <<PY
          d=float('$DUR')
          assert 88 <= d <= 98, d
          print('NOAA duration OK:', d)
          PY

      - name: Render final short with exact af_heart profile
        run: |
          cat > work/render.py <<'PY'
          import dataclasses, hashlib, json, math, os, re, subprocess
          from pathlib import Path
          import numpy as np
          import onnxruntime as ort
          import soundfile as sf
          from kokoro_onnx import Kokoro
          from PIL import Image, ImageDraw

          W=Path('work'); A=W/'assets'; M=W/'models'; O=W/'out'; Q=W/'qa'
          SRC=A/'noaa_bigfin.mp4'; MODEL=M/'kokoro-v1.0.onnx'; VOICES=M/'voices-v1.0.bin'
          FINAL=O/'Strange_But_Verified_Bigfin_Squid_FINAL.mp4'
          SCRIPT="Those look like elbows. So what is this? A real bigfin squid, filmed by NOAA two point four kilometers down. Its eight arms and two tentacles bend, then hang like wires. The largest known one reached six point four meters — six point one meters of that was arms and tentacles. Scientists think these hanging appendages may trap prey that bumps into them. Almost the entire squid is arms and tentacles."
          CUES=[
            ("Those look like elbows.",r"THOSE LOOK LIKE {\c&H66D7FF&}ELBOWS{\c&HFFFFFF&}."),
            ("So what is this?",r"SO WHAT IS THIS?"),
            ("A real bigfin squid,",r"A REAL {\c&H66D7FF&}BIGFIN SQUID{\c&HFFFFFF&}."),
            ("filmed by NOAA two point four kilometers down.",r"FILMED BY NOAA\N{\c&H66D7FF&}2.4 KM DOWN{\c&HFFFFFF&}."),
            ("Its eight arms and two tentacles",r"8 ARMS + {\c&H66D7FF&}2 TENTACLES{\c&HFFFFFF&}"),
            ("bend, then hang like wires.",r"THEY BEND...\NTHEN HANG LIKE {\c&H66D7FF&}WIRES{\c&HFFFFFF&}."),
            ("The largest known one reached six point four meters",r"LARGEST KNOWN:\N{\c&H66D7FF&}6.4 METERS{\c&HFFFFFF&}"),
            ("six point one meters of that was arms and tentacles.",r"{\c&H66D7FF&}6.1 METERS{\c&HFFFFFF&}\NWAS ARMS + TENTACLES."),
            ("Scientists think these hanging appendages",r"SCIENTISTS THINK\NTHESE APPENDAGES..."),
            ("may trap prey that bumps into them.",r"MAY {\c&H66D7FF&}TRAP PREY{\c&HFFFFFF'}\NTHAT BUMPS INTO THEM."),
            ("Almost the entire squid is arms and tentacles.",r"ALMOST THE ENTIRE SQUID\NIS {\c&H66D7FF&}ARMS + TENTACLES{\c&HFFFFFF&}.")]
          HEAD=.120; TAIL=.080
          STARTS=[12.0,16.5,21.0,30.0,39.0,48.0,58.0,66.0,72.0]
          BASE=[2.2,2.3,2.8,3.0,3.2,3.3,3.4,3.6]

          def run(cmd, cap=False, check=True):
              print('+',' '.join(map(str,cmd)), flush=True)
              return subprocess.run(cmd,text=True,check=check,stdout=subprocess.PIPE if cap else None,stderr=subprocess.PIPE if cap else None)
          def dur(p): return float(run(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(p)],True).stdout.strip())
          def h(p):
              x=hashlib.sha256();
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''): x.update(b)
              return x.hexdigest()
          def at(t):
              cs=int(round(max(0,t)*100)); hh,cs=divmod(cs,360000); mm,cs=divmod(cs,6000); ss,cs=divmod(cs,100)
              return f'{hh}:{mm:02d}:{ss:02d}.{cs:02d}'

          # Exact approved voice profile.
          os.environ['ORT_DISABLE_TELEMETRY']='1'; ort.disable_telemetry_events()
          opt=ort.SessionOptions(); opt.intra_op_num_threads=4; opt.inter_op_num_threads=1
          sess=ort.InferenceSession(str(MODEL),sess_options=opt,providers=['CPUExecutionProvider'])
          k=Kokoro.from_session(sess,str(VOICES))
          ph=k.tokenizer.phonemize(SCRIPT,lang='en-us')
          audio,sr,times=k.create_timed(ph,voice='af_heart',speed=0.88,lang='en-us',is_phonemes=True,trim=False,continuous=True)
          assert float(np.max(np.abs(audio)))<1.0
          sf.write(W/'raw.wav',audio,sr,subtype='PCM_24')
          run(['ffmpeg','-y','-v','error','-i',str(W/'raw.wav'),'-af',f'adelay={int(HEAD*1000)},apad=pad_dur={TAIL}','-ar','48000','-ac','2','-c:a','pcm_s24le',str(W/'padded.wav')])
          p1=run(['ffmpeg','-hide_banner','-i',str(W/'padded.wav'),'-af','loudnorm=I=-15:TP=-2:LRA=7:print_format=json','-f','null','-'],True)
          m=re.findall(r'\{\s*"input_i".*?\}',p1.stderr,re.S); assert m
          z=json.loads(m[-1]); f=(f"loudnorm=I=-15:TP=-2:LRA=7:measured_I={z['input_i']}:measured_LRA={z['input_lra']}:measured_TP={z['input_tp']}:measured_thresh={z['input_thresh']}:offset={z['target_offset']}:linear=true")
          run(['ffmpeg','-y','-v','error','-i',str(W/'padded.wav'),'-af',f,'-ar','48000','-ac','2','-c:a','pcm_s24le',str(W/'voice.wav')])
          total=dur(W/'voice.wav')
          td=[dataclasses.asdict(t) for t in times]

          # Map text cue locations to timed phoneme positions, matching the production package logic.
          known=k.tokenizer.known(ph); cursor=0; out=[]
          for spoken,display in CUES:
              s=SCRIPT.find(spoken,cursor); assert s>=0; cursor=s+len(spoken)
              pfx=SCRIPT[:s]
              pph=k.tokenizer.known(k.tokenizer.phonemize(pfx,lang='en-us')) if pfx.strip() else ''
              cph=k.tokenizer.known(k.tokenizer.phonemize(spoken,lang='en-us'))
              guess=len(pph); pos=known.find(cph,max(0,guess-40),min(len(known),guess+len(cph)+40))
              if pos<0:
                  pos=int(round((s/max(1,len(SCRIPT)))*len(td))); plen=max(1,int(round((len(spoken)/len(SCRIPT))*len(td))))
              else: plen=max(1,len(cph))
              pos=max(0,min(pos,len(td)-1)); ei=max(pos,min(pos+plen-1,len(td)-1))
              out.append([float(td[pos]['start'])+HEAD,float(td[ei]['end'])+HEAD,display])
          for i in range(len(out)-1): out[i][1]=max(out[i][1],out[i+1][0]-.035)

          ass=W/'captions.ass'
          ass.write_text('[Script Info]\nScriptType: v4.00+\nPlayResX: 1080\nPlayResY: 1920\nWrapStyle: 2\nScaledBorderAndShadow: yes\nYCbCr Matrix: TV.709\n\n[V4+ Styles]\nFormat: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding\nStyle: Caption,DejaVu Sans,56,&H00FFFFFF,&H00FFFFFF,&H00000000,&H50000000,-1,0,0,0,100,100,0,0,1,7,1,5,45,160,20,1\n\n[Events]\nFormat: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text\n'+''.join(f'Dialogue: 0,{at(s)},{at(e)},Caption,,0,0,0,,{{\\an5\\pos(490,1360)}}{txt}\n' for s,e,txt in out),encoding='utf-8')

          rem=total-sum(BASE); ds=BASE+[rem] if rem>=1 else [total/9]*9
          chains=[]; labs=[]
          for i,(s,d) in enumerate(zip(STARTS,ds)):
              labs.append(f'[v{i}]')
              # Real source only, proportional reframe, never stretch.
              chains.append(f'[0:v]trim=start={s:.3f}:duration={d:.3f},setpts=PTS-STARTPTS,scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920:(iw-1080)/2:(ih-1920)/2,fps=30,setsar=1[v{i}]')
          chains.append(''.join(labs)+f'concat=n=9:v=1:a=0[base]')
          fontb='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'; fontr='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          chains.append("[base]drawbox=x=42:y=56:w=360:h=38:color=0x242424@0.67:t=fill,drawbox=x=42:y=98:w=360:h=29:color=0x242424@0.60:t=fill,"+f"drawtext=fontfile='{fontb}':text='STRANGE, BUT VERIFIED':x=52:y=63:fontsize=22:fontcolor=white,"+f"drawtext=fontfile='{fontr}':text='NOAA OCEAN EXPLORATION • EX2107':x=52:y=104:fontsize=15:fontcolor=white@0.92,"+f"subtitles=filename='{ass}':fontsdir='/usr/share/fonts/truetype/dejavu'[vout]")
          fc=';'.join(chains)
          run(['ffmpeg','-y','-v','warning','-i',str(SRC),'-i',str(W/'voice.wav'),'-filter_complex',fc,'-map','[vout]','-map','1:a:0','-c:v','libx264','-preset','medium','-profile:v','high','-level:v','4.2','-b:v','12M','-maxrate','15M','-bufsize','24M','-pix_fmt','yuv420p','-r','30','-g','60','-keyint_min','30','-sc_threshold','0','-color_primaries','bt709','-color_trc','bt709','-colorspace','bt709','-c:a','aac','-b:a','192k','-ar','48000','-ac','2','-t',f'{total:.3f}','-movflags','+faststart',str(FINAL)])

          # Technical QA + contact sheets.
          dec=run(['ffmpeg','-v','error','-xerror','-i',str(FINAL),'-f','null','-'],True,False)
          assert dec.returncode==0 and not dec.stderr.strip(), dec.stderr
          probe=json.loads(run(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(FINAL)],True).stdout)
          vv=next(x for x in probe['streams'] if x['codec_type']=='video'); aa=next(x for x in probe['streams'] if x['codec_type']=='audio')
          assert int(vv['width'])==1080 and int(vv['height'])==1920 and vv['codec_name']=='h264' and aa['codec_name']=='aac'
          loud=run(['ffmpeg','-hide_banner','-i',str(FINAL),'-af','loudnorm=I=-15:TP=-2:LRA=7:print_format=json','-f','null','-'],True,False)
          lm=re.findall(r'\{\s*"input_i".*?\}',loud.stderr,re.S); lm=json.loads(lm[-1]) if lm else {}
          black=run(['ffmpeg','-hide_banner','-i',str(FINAL),'-vf','blackdetect=d=0.10:pix_th=0.10','-an','-f','null','-'],True,False)
          b=[x for x in black.stderr.splitlines() if 'black_start:' in x]
          meta={'duration':dur(FINAL),'video':vv,'audio':aa,'loudness':lm,'blackdetect_events':b,'sha256':h(FINAL),'model_sha256':h(MODEL),'voices_sha256':h(VOICES),'source':'NOAA Ocean Exploration, Windows to the Deep 2021, EX2107','voice':'af_heart','speed':0.88,'lang':'en-us','continuous':True,'trim':False}
          (Q/'technical_qa.json').write_text(json.dumps(meta,indent=2))
          (Q/'QA_REPORT.txt').write_text(f"PASS full decode\n1080x1920 / 30 fps / H.264 High / AAC 48k stereo\nDuration: {meta['duration']:.3f}s\nLoudness: {lm.get('input_i')} LUFS\nTrue peak: {lm.get('input_tp')} dBTP\nBlackdetect events: {len(b)}\nSHA256: {meta['sha256']}\n")

          def sheet(video,times,outf,cols=4):
              cells=[]; tmp=Q/'frames'; tmp.mkdir(exist_ok=True)
              for i,t in enumerate(times):
                  p=tmp/f'{outf.stem}_{i}.jpg'; run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',str(video),'-frames:v','1','-q:v','2',str(p)])
                  im=Image.open(p).convert('RGB'); im.thumbnail((270,480)); c=Image.new('RGB',(300,525),'white'); c.paste(im,((300-im.width)//2,5)); ImageDraw.Draw(c).text((12,498),f'{t:.2f}s',fill='black'); cells.append(c)
              rows=math.ceil(len(cells)/cols); sh=Image.new('RGB',(cols*300,rows*525),'white')
              for i,c in enumerate(cells): sh.paste(c,((i%cols)*300,(i//cols)*525))
              sh.save(outf,quality=92)
          sheet(FINAL,[0,.2,.4,.6,.8,1,1.25,1.5,1.75,2,2.5,3],Q/'opening_frames_contact_sheet.jpg')
          sheet(FINAL,[max(0,min(total-.05,total*i/11)) for i in range(12)],Q/'contact_sheet.jpg',3)
          sheet(SRC,[s+.35 for s in STARTS],Q/'source_ranges_contact_sheet.jpg',3)
          print('FINAL',FINAL,'duration',total,'sha256',h(FINAL))
          PY
          python work/render.py

      - name: Upload final MP4 and QA
        uses: actions/upload-artifact@v4
        with:
          name: SBV-Bigfin-Squid-FINAL
          path: |
            work/out/Strange_But_Verified_Bigfin_Squid_FINAL.mp4
            work/qa/
          retention-days: 1
          compression-level: 0
