name: SBV Serious Documentary Voice Tests

on:
  push:
    paths:
      - '.github/workflows/sbv-serious-doc-voices.yml'

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg

      - name: Kokoro env
        run: |
          python -m venv .venv-kokoro
          .venv-kokoro/bin/python -m pip install --upgrade pip
          .venv-kokoro/bin/python -m pip install 'kokoro-onnx==0.6.1' soundfile
          curl -L --fail -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -L --fail -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin

      - name: Generate serious reference voices
        run: |
          cat > make_refs.py <<'PY'
          import soundfile as sf
          from kokoro_onnx import Kokoro
          text = "Across the frozen river, a vast circle of ice turns almost silently. No machine carved it. No one set it in motion. The river itself did that."
          k = Kokoro('kokoro-v1.0.onnx','voices-v1.0.bin')
          for voice,speed,out in [
              ('af_nicole',0.82,'REF_US_NICOLE.wav'),
              ('bf_isabella',0.84,'REF_UK_ISABELLA.wav')]:
              audio,sr=k.create(text,voice=voice,speed=speed,lang='en-us' if voice.startswith('a') else 'en-gb')
              sf.write(out,audio,sr,subtype='PCM_16')
          PY
          .venv-kokoro/bin/python make_refs.py

      - name: Chatterbox env
        run: |
          python -m venv .venv-chatter
          .venv-chatter/bin/python -m pip install --upgrade pip setuptools wheel
          .venv-chatter/bin/python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          .venv-chatter/bin/python -m pip install chatterbox-tts==0.1.6 soundfile
          .venv-chatter/bin/python -m pip uninstall -y resemble-perth
          .venv-chatter/bin/python -m pip install --no-deps 'git+https://github.com/resemble-ai/Perth.git@master'

      - name: Generate serious documentary variants
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
        run: |
          cat > synth.py <<'PY'
          import random, numpy as np, torch, torchaudio as ta
          import chatterbox.tts_turbo as turbo
          from huggingface_hub import snapshot_download as hf_snapshot_download

          TEXT = "As the mass turns, it rubs against surrounding ice and shoreline, grinding the edge smoother and smoother. And the spinning may get help from the ice itself. Lab experiments found that melting can create a vortex underneath an ice disk and keep it rotating."

          def public_snapshot_download(*args, **kwargs):
              kwargs.pop('token', None)
              return hf_snapshot_download(*args, token=False, **kwargs)
          turbo.snapshot_download = public_snapshot_download
          random.seed(7); np.random.seed(7); torch.manual_seed(7)
          model = turbo.ChatterboxTurboTTS.from_pretrained(device='cpu')
          settings=dict(temperature=0.55,min_p=0.0,top_p=0.85,top_k=700,repetition_penalty=1.15,norm_loudness=True)
          for ref,out in [('REF_US_NICOLE.wav','D_US_SERIOUS_RAW.wav'),('REF_UK_ISABELLA.wav','E_UK_SERIOUS_RAW.wav')]:
              wav=model.generate(TEXT,audio_prompt_path=ref,**settings)
              ta.save(out,wav.cpu(),model.sr)
          PY
          .venv-chatter/bin/python synth.py

      - name: Master files
        run: |
          for f in D_US_SERIOUS E_UK_SERIOUS; do
            ffmpeg -y -v error -i ${f}_RAW.wav -af loudnorm=I=-16:TP=-2:LRA=5 -ar 48000 -ac 1 ${f}_FINAL.wav
            ffmpeg -y -v error -i ${f}_FINAL.wav -codec:a libmp3lame -b:a 192k ${f}_FINAL.mp3
            ffmpeg -v error -i ${f}_FINAL.wav -f null -
          done

      - name: Upload serious documentary variants
        uses: actions/upload-artifact@v4
        with:
          name: SBV-Serious-Documentary-Voices
          path: |
            D_US_SERIOUS_FINAL.mp3
            D_US_SERIOUS_FINAL.wav
            E_UK_SERIOUS_FINAL.mp3
            E_UK_SERIOUS_FINAL.wav
            REF_US_NICOLE.wav
            REF_UK_ISABELLA.wav
          retention-days: 7
