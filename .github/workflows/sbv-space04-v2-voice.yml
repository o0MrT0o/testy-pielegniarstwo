name: Io V2 original standard narrator
on:
  push:
    branches: [sbv-space04-io-v2-final-20261021]
    paths: ['.github/workflows/sbv-space04-v2-voice.yml']
permissions: {contents: read}
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Original channel TTS environment
        run: |
          sudo apt-get update -qq && sudo apt-get install -y espeak-ng libsndfile1
          pip install 'kokoro-onnx==0.6.1' soundfile faster-whisper
      - name: Download and verify channel-approved model
        run: |
          curl -LfSs --retry 4 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx' -o kokoro-v1.0.onnx
          curl -LfSs --retry 4 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' -o voices-v1.0.bin
      - name: Synthesize verified af_heart speed 0.88
        run: |
          cat > /tmp/voice.py <<'PY'
          import os,hashlib,json,soundfile as sf
          from kokoro_onnx import Kokoro
          script="That cloud is a volcanic eruption on Jupiter's moon Io. NASA watched a giant plume rise three hundred and thirty kilometres above its surface. But what fuels volcanoes on a moon? Jupiter and its neighbouring moons tug on Io, flexing and heating it from inside. Decades later, Juno detected extreme volcanic heat in infrared. Our solar system's most volcanically active world isn't even a planet."
          expected={"kokoro-v1.0.onnx":"beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a","voices-v1.0.bin":"bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d"}
          for f,sha in expected.items():
           observed=hashlib.file_digest(open(f,"rb"),"sha256").hexdigest()
           assert observed==sha,(f,observed)
          model=Kokoro("kokoro-v1.0.onnx","voices-v1.0.bin")
          wave,sr=model.create(script,voice="af_heart",speed=0.88,lang="en-us")
          os.makedirs("out",exist_ok=True)
          sf.write("out/SBV_IO_V2_STANDARD_af_heart.wav",wave,sr,subtype="PCM_24")
          open("out/narration.txt","w").write(script)
          print("VOICE_SECONDS",round(len(wave)/sr,3),flush=True)
          try:
           import av
           original=av.open
           def patched(*args,**kwargs):
            kwargs.pop("metadata_errors",None);return original(*args,**kwargs)
           av.open=patched
           from faster_whisper import WhisperModel
           m=WhisperModel("tiny.en",device="cpu",compute_type="int8",cpu_threads=2)
           segs,_=m.transcribe("out/SBV_IO_V2_STANDARD_af_heart.wav",beam_size=3,word_timestamps=True,language="en",vad_filter=False)
           words=[{"word":w.word,"start":round(w.start,3),"end":round(w.end,3)} for seg in segs for w in (seg.words or [])]
           json.dump(words,open("out/word_timings.json","w"),indent=2)
           print("ASR_TRANSCRIPT"," ".join(w["word"] for w in words),flush=True)
          except Exception as e:print("ASR_WARNING",str(e),flush=True)
          
          PY
          python /tmp/voice.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SBV_IO_V2_AfHeart_WAV_and_Timings
          path: out/
          retention-days: 7
