name: SBV Racetrack Ice Fix

on:
  push:
    branches: [sbv-racetrack-temp]
    paths:
      - '.github/workflows/sbv-racetrack-icefix.yml'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Download previous approved master build
        uses: actions/download-artifact@v4
        with:
          name: sbv-racetrack-final
          path: base
          run-id: 37893714936
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download direct USGS public-domain ice footage
        run: |
          curl -L --fail --retry 3 \
            -o IceBreak2017_USGS.mp4 \
            'https://usgs-ocapsv2-public-input-media.s3.us-west-2.amazonaws.com/assets/palladium/production/s3fs-public/IceBreak2017.mp4'
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 IceBreak2017_USGS.mp4

      - name: Replace the ice explanation visuals and source label
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i base/SBV_Racetrack_Moving_Rocks_FINAL.mp4 \
            -i IceBreak2017_USGS.mp4 \
            -filter_complex "[1:v]trim=start=0:duration=11.254,setpts=PTS-STARTPTS+15.544/TB,scale=1080:608:force_original_aspect_ratio=decrease,pad=1080:608:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1[ice];[0:v][ice]overlay=x=0:y=215:enable='between(t,15.544,26.798)'[v1];[v1]drawbox=x=38:y=126:w=660:h=34:color=black@0.82:t=fill:enable='between(t,15.544,26.798)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='USGS | ILLUSTRATIVE ICE FOOTAGE | PUBLIC DOMAIN':x=48:y=131:fontsize=21:fontcolor=white:borderw=1:bordercolor=black@0.9:enable='between(t,15.544,26.798)'[vout]" \
            -map '[vout]' -map 0:a:0 \
            -c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p -r 30 \
            -c:a copy -movflags +faststart \
            SBV_Racetrack_Moving_Rocks_FINAL_V2.mp4

      - name: QA fixed master
        run: |
          ffmpeg -hide_banner -v error -i SBV_Racetrack_Moving_Rocks_FINAL_V2.mp4 -f null - 2> decode_check_v2.txt
          ffprobe -v error -show_entries stream=index,codec_name,width,height,r_frame_rate,pix_fmt,sample_rate,channels -show_entries format=duration,size -of json SBV_Racetrack_Moving_Rocks_FINAL_V2.mp4 > probe_v2.json
          ffmpeg -hide_banner -loglevel error -y -i SBV_Racetrack_Moving_Rocks_FINAL_V2.mp4 -vf "fps=1/3,scale=270:480,tile=4x3:padding=5:margin=5" -frames:v 1 final_contact_v2.jpg
          sha256sum SBV_Racetrack_Moving_Rocks_FINAL_V2.mp4 > sha256_v2.txt

      - name: Upload corrected master
        uses: actions/upload-artifact@v4
        with:
          name: sbv-racetrack-final-v2
          path: |
            SBV_Racetrack_Moving_Rocks_FINAL_V2.mp4
            final_contact_v2.jpg
            probe_v2.json
            decode_check_v2.txt
            sha256_v2.txt
            base/SBV_Racetrack_QA.md
          retention-days: 2
