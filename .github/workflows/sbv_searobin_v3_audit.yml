name: SBV Searobin V3 Source Framing Audit

on:
  push:
    paths:
      - '.github/workflows/sbv_searobin_v3_audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build selected source frames
        run: |
          set -euxo pipefail
          mkdir -p work/frames
          curl -L --fail --retry 4 --retry-all-errors -o work/source.mp4 'https://oceanexplorer.noaa.gov/wp-content/uploads/2018/05/searobin_1280x720.mp4'
          for T in 18.0 20.5 24.0 27.0 30.0 33.0 39.0 40.5; do
            N=$(echo "$T" | tr '.' '_')
            ffmpeg -y -v error -ss "$T" -i work/source.mp4 -frames:v 1 -q:v 2 "work/frames/f_${N}.jpg"
          done
          ffmpeg -y -v error \
            -i work/frames/f_18_0.jpg -i work/frames/f_20_5.jpg -i work/frames/f_24_0.jpg -i work/frames/f_27_0.jpg \
            -i work/frames/f_30_0.jpg -i work/frames/f_33_0.jpg -i work/frames/f_39_0.jpg -i work/frames/f_40_5.jpg \
            -filter_complex '[0:v][1:v][2:v][3:v][4:v][5:v][6:v][7:v]hstack=inputs=8,scale=2400:-2' -frames:v 1 work/frames/contact.jpg || true
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: SBV-Searobin-V3-Source-Audit
          path: work/frames/
          retention-days: 1
          compression-level: 0
