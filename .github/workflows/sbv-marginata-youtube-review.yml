name: SBV marginata youtube review
on:
  push:
    branches: [chatgpt-sbv-render-assets]
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q yt-dlp
      - name: Download and make review sheets
        run: |
          mkdir -p out
          yt-dlp -f 'bv*[height<=1080]+ba/b[height<=1080]' --merge-output-format mp4 -o 'out/marginata.%(ext)s' 'https://www.youtube.com/watch?v=Il9Mi0CM1Iw'
          ffmpeg -y -i out/marginata.mp4 -vf "fps=1/3,scale=320:-1,tile=5x5" -frames:v 4 out/contact_%02d.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: sbv-marginata-youtube-review
          path: out/
          retention-days: 1
