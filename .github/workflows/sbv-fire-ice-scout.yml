name: SBV Fire Ice Source Scout

on:
  push:
    paths:
      - '.github/workflows/sbv-fire-ice-scout.yml'

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Download verified public sources
        run: |
          curl -L --fail -o usgs_lab.mp4 'https://usgs-ocapsv2-public-input-media.s3.us-west-2.amazonaws.com/assets/palladium/production/s3fs-public/Gas_Hydrates_2012.mp4'
          curl -L --fail -o noaa_hydrate.mp4 'https://oceanexplorer.noaa.gov/wp-content/uploads/2013/01/methane-1280x720-2.mp4'
          curl -L --fail -o noaa_bubbles.mp4 'https://oceanexplorer.noaa.gov/wp-content/uploads/2023/09/dive04-follow-bubbles-1920x1080-1.mp4'
      - name: Probe sources
        run: |
          for f in usgs_lab.mp4 noaa_hydrate.mp4 noaa_bubbles.mp4; do
            ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json "$f" > "${f%.mp4}_probe.json"
          done
      - name: Make contact sheets
        run: |
          mkdir -p sheets
          ffmpeg -y -v error -i usgs_lab.mp4 -vf "fps=1/8,scale=320:-1,tile=5x11:padding=4:margin=4" -frames:v 1 sheets/usgs_0_440.jpg || true
          ffmpeg -y -v error -i noaa_hydrate.mp4 -vf "fps=1/3,scale=320:-1,tile=5x6:padding=4:margin=4" -frames:v 1 sheets/noaa_hydrate.jpg || true
          ffmpeg -y -v error -i noaa_bubbles.mp4 -vf "fps=1/4,scale=320:-1,tile=5x8:padding=4:margin=4" -frames:v 1 sheets/noaa_bubbles.jpg || true
      - name: Make small proxies
        run: |
          ffmpeg -y -v error -i usgs_lab.mp4 -vf scale=640:-2 -c:v libx264 -preset veryfast -crf 31 -an usgs_proxy.mp4
          ffmpeg -y -v error -i noaa_hydrate.mp4 -vf scale=640:-2 -c:v libx264 -preset veryfast -crf 31 -an noaa_hydrate_proxy.mp4
          ffmpeg -y -v error -i noaa_bubbles.mp4 -vf scale=640:-2 -c:v libx264 -preset veryfast -crf 31 -an noaa_bubbles_proxy.mp4
      - name: Upload scout artifact
        uses: actions/upload-artifact@v4
        with:
          name: SBV-Fire-Ice-Scout
          path: |
            sheets/*.jpg
            *_probe.json
            *_proxy.mp4
          retention-days: 7
